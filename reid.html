<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Reid's Zone · The Learn Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#231f3d; --meta:#6b6885; --ry:#15803d; --ry-deep:#14532d; --cream:#fffdf8;
    --green:#166534; --amber:#f59e0b; --line:#e5e1f2; --display:'Baloo 2',system-ui,sans-serif; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:Nunito,-apple-system,BlinkMacSystemFont,system-ui,sans-serif; color:var(--ink);
    background:var(--cream); display:flex; }
  a{ color:var(--ry); }
  a:hover{ color:var(--ry-deep); }

  /* ---------- left rail ---------- */
  .rail{ flex:none; width:312px; background:var(--ry); color:#fff; padding:26px 24px; display:flex;
    flex-direction:column; gap:18px; overflow:auto; }
  .rail h1{ font-family:var(--display); font-size:24px; font-weight:700; line-height:1.05; margin:0; }
  .rail .date{ font-size:13px; font-weight:700; color:#bbf7d0; }
  .dialbox{ display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.12); border-radius:20px; padding:16px; }
  .dial{ flex:none; width:86px; height:86px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .dial i{ width:64px; height:64px; border-radius:50%; background:var(--ry); display:flex; align-items:center;
    justify-content:center; font-family:var(--display); font-size:23px; font-weight:700; font-style:normal; }
  .dialbox .left{ font-family:var(--display); font-size:20px; font-weight:700; line-height:1.1; }
  .dialbox .streak{ font-size:12.5px; font-weight:700; color:#bbf7d0; }
  .rail .lbl{ font-size:11px; font-weight:900; letter-spacing:1.3px; text-transform:uppercase; color:#bbf7d0; margin-bottom:9px; }
  .rrow{ display:flex; align-items:center; gap:11px; white-space:nowrap; font-size:14.5px; font-weight:800; padding:3px 0; cursor:pointer; }
  .rbox{ flex:none; width:23px; height:23px; border-radius:8px; border:3px solid rgba(255,255,255,.45);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:var(--ry); }
  .rrow.on .rbox{ background:#fbbf24; border-color:#fbbf24; }
  .rrow.on span{ text-decoration:line-through; color:#bbf7d0; }
  .rrow .rm{ margin-left:auto; font-size:12px; font-weight:900; color:#bbf7d0; opacity:.7; }
  .rrow .rm:hover{ opacity:1; }
  .addOuting{ font-size:13px; font-weight:800; color:#bbf7d0; cursor:pointer; padding:7px; text-align:center;
    border:2px dashed rgba(255,255,255,.35); border-radius:10px; margin-top:6px; }
  .addOuting:hover{ color:#fff; border-color:#fff; }
  .outinginput{ width:100%; font-size:14px; font-weight:700; padding:9px 11px; border:none; border-radius:10px;
    font-family:inherit; margin-top:6px; }
  .jwrap{ flex:1; min-height:120px; display:flex; flex-direction:column; }
  .jwrap textarea{ flex:1; width:100%; min-height:90px; background:rgba(255,255,255,.12); border:none; border-radius:16px;
    padding:12px; color:#fff; font-family:inherit; font-size:13.5px; font-weight:600; resize:none; }
  .jwrap textarea::placeholder{ color:#bbf7d0; }
  .jsaved{ font-size:11px; font-weight:800; color:#bbf7d0; height:14px; margin-top:5px; }
  .railnav{ display:flex; flex-wrap:wrap; gap:8px; }
  .railnav a, .railnav .pill{ text-decoration:none; font-size:12.5px; font-weight:800; color:#dcfce7;
    background:rgba(255,255,255,.14); padding:8px 12px; border-radius:999px; cursor:pointer; }
  .railnav .pill.active{ background:#fff; color:var(--ry); }

  /* ---------- main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .mainhead{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:26px 34px 14px; }
  .mainhead h2{ font-family:var(--display); font-size:27px; font-weight:700; margin:0; }
  .mainhead .hint{ font-size:13.5px; font-weight:700; color:var(--meta); }
  .route{ flex:1; min-height:0; overflow:auto; padding:0 34px 26px; display:flex; flex-direction:column; gap:10px; }

  .stop{ display:flex; align-items:center; gap:16px; }
  .sbox{ flex:none; width:34px; height:34px; border-radius:50%; border:3px solid #d7d3ea; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:900; color:#fff; cursor:pointer; }
  .stop.done{ opacity:.55; }
  .stop.done .sbox{ background:var(--green); border-color:var(--green); }
  .stop .t{ font-size:16.5px; font-weight:800; flex:1; min-width:0; }
  .stop.done .t{ text-decoration:line-through; font-size:16px; }
  .stop .pg{ flex:none; font-size:13px; font-weight:700; color:var(--meta); white-space:nowrap; }
  .stop .go{ font-size:13px; font-weight:800; text-decoration:none; }

  .nowstop{ display:flex; gap:16px; align-items:stretch; }
  .nowstop .sbox{ border:4px solid var(--ry); cursor:default; }
  .nowcard{ flex:1; min-width:0; background:var(--ry); color:#fff; border-radius:22px; padding:22px 26px;
    display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .nowcard .kick{ font-size:11.5px; font-weight:900; letter-spacing:1.4px; text-transform:uppercase; color:#bbf7d0; }
  .nowcard .title{ font-family:var(--display); font-size:34px; font-weight:700; line-height:1.1; margin:5px 0 4px; text-wrap:pretty; }
  .nowcard .meta{ font-size:14.5px; font-weight:700; color:#dcfce7; }
  .nowcard .meta a{ color:#fff; font-weight:800; }
  .finish{ flex:none; background:#fff; color:var(--ry); font-weight:900; font-size:16px; padding:14px 24px;
    border:none; border-radius:14px; font-family:inherit; cursor:pointer; }
  .finish:hover{ background:#f0fdf4; }

  .attachRow{ display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; padding:3px 0 3px 50px; }
  .nowcard .attachWrap{ flex-basis:100%; margin-top:12px; }
  .nowcard .attachRow{ padding-left:0; color:#dcfce7; }
  .attachCheck{ flex:none; width:22px; height:22px; border-radius:50%; border:3px solid #cfcbe6; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff; }
  .nowcard .attachCheck{ border-color:rgba(255,255,255,.55); }
  .attachCheck.on{ background:var(--green); border-color:var(--green); }
  .nowcard .attachCheck.on{ background:#fbbf24; border-color:#fbbf24; color:var(--ry); }
  .attachLink{ font-weight:800; text-decoration:none; }
  .nowcard .attachLink{ color:#fff; }
  .attachLink.bad{ color:#b91c1c; font-style:italic; }

  .endflag{ display:flex; align-items:center; gap:16px; margin-top:6px; }
  .endflag .ic{ flex:none; width:34px; height:34px; border-radius:50%; background:#fef3c7; display:flex;
    align-items:center; justify-content:center; font-size:17px; }
  .endflag .msg{ flex:1; background:#fef3c7; border-radius:16px; padding:14px 20px; font-family:var(--display);
    font-size:19px; font-weight:700; color:#92400e; }
  .endflag.done .ic, .endflag.done .msg{ background:#dcfce7; color:#166534; }
  .pausednote{ font-size:12.5px; font-weight:700; color:var(--meta); padding:4px 0 0 50px; }

  .frame{ flex:1; min-height:0; padding:0 18px 18px; }
  .frame iframe{ width:100%; height:100%; border:none; border-radius:18px; background:#fff;
    box-shadow:0 10px 30px rgba(30,41,99,.10); display:block; }
  .hide{ display:none !important; }

  @media (max-width:900px){
    body{ flex-direction:column; height:auto; }
    .rail{ width:100%; }
    .route{ overflow:visible; }
    .frame{ height:80vh; }
  }
</style>
</head>
<body>

<div class="rail">
  <div>
    <h1>Reid's day</h1>
    <div class="date" id="todayLabel"></div>
  </div>

  <div class="dialbox">
    <div class="dial" id="dial"><i id="dialText">0/0</i></div>
    <div>
      <div class="left" id="stopsLeft">—</div>
      <div class="streak" id="streak"></div>
    </div>
  </div>

  <div>
    <div class="lbl">Every day</div>
    <div id="habitList"></div>
    <div id="outingList"></div>
  </div>

  <div class="jwrap">
    <div class="lbl">Journal</div>
    <textarea id="journalInput" placeholder="One line about today..."></textarea>
    <div class="jsaved" id="journalSaved"></div>
  </div>

  <div class="railnav">
    <span class="pill active" data-tab="work">Today</span>
    <span class="pill" data-tab="week">Week</span>
    <span class="pill" data-tab="cal">Calendar</span>
    <span class="pill" data-tab="journal">Journal</span>
    <a href="index.html">← Learn Zone</a>
  </div>
</div>

<div class="main">
  <div id="viewWork" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div class="mainhead">
      <h2>Today's route</h2>
      <div class="hint" id="routeHint"></div>
    </div>
    <div class="route" id="routeList"></div>
  </div>
  <div id="viewWeek" class="frame hide"><iframe id="fWeek" data-src="plan/week.html?kid=reid"></iframe></div>
  <div id="viewCal" class="frame hide"><iframe id="fCal" data-src="plan/calendar.html?kid=reid"></iframe></div>
  <div id="viewJournal" class="frame hide"><iframe id="fJournal" data-src="plan/journal.html?kid=reid"></iframe></div>
</div>

<script src="plan/curriculum.js"></script>
<script src="plan/lz-common.js?v=7"></script>
<script src="plan/lz-sync.js?v=14"></script>
<script>
const KID = "reid";
const CFG = window.LZ_CONFIG || {paused:[], habits:[]};
const { dkey, dateKey, doneDate, doneDatesForSubject, todayISO, isDone, setDone, habitKey, outingKey,
  getOutings, setOutings, journalKey, getJournal, setJournal, getAllSubjects, combinedQueue, lessonItemId,
  getManualLessons, manualDoneKey, getAttachments, attachDoneKey, safeUrl, dailyPick, appLink,
  ensureRecurringSeeded, isSkipped, subjectResumesOn, scanKeys } = window.LZ;

function stopLabel(s){ return s.title===s.subject ? esc(s.subject) : esc(s.subject)+" — "+esc(s.title); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

/* ---------- tabs: Today is rendered natively; the other three stay iframes ---------- */
document.querySelectorAll(".railnav .pill").forEach(p=>{
  p.addEventListener("click", ()=>{
    document.querySelectorAll(".railnav .pill").forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    const t = p.dataset.tab;
    document.getElementById("viewWork").classList.toggle("hide", t!=="work");
    document.getElementById("viewWeek").classList.toggle("hide", t!=="week");
    document.getElementById("viewCal").classList.toggle("hide", t!=="cal");
    document.getElementById("viewJournal").classList.toggle("hide", t!=="journal");
    // Loaded on first visit only, so opening this page doesn't boot three extra pages.
    const frame = {week:"fWeek", cal:"fCal", journal:"fJournal"}[t];
    if(frame){ const f = document.getElementById(frame); if(!f.src && f.dataset.src) f.src = f.dataset.src; }
  });
});

/* ---------- the route: one stop per active subject, in curriculum order ----------
   The decision of WHAT a day holds lives in lz-common's planDays(), shared with the
   Teacher Dashboard's planner so the checklist and the dashboard cannot disagree — they
   used to drift apart in four separate ways (weekend schedules, a subject finished for
   the day still getting its next lesson, a queue head pinned to a future day, and days
   marked off). This function only turns those cards into stops: wording, links and the
   itemId that attachments hang off. Same records as before (dkey / dateKey /
   manualDoneKey), so checking a stop off here still shows up on the Master Tracker,
   calendar and daily sheets. */
function buildRoute(){
  const today = todayISO();
  return LZ.planForDay(KID, today).map(c=>{
    const stop = { key:c.doneKey, subject:c.subject, title:c.title, done:c.done,
                   itemId:c.itemId, note:"", link:"" };
    if(c.type === "ongoing"){
      // The stop is named for the SUBJECT ("Math"), with the app as the note — except a
      // daily-rotation subject, where the chosen app is the point ("Fact Checker"). The
      // planner grid names these the other way round, which is why the shared card keeps
      // subject and pick separate rather than baking one title for both views.
      if(c.pick){
        stop.title = c.pick;
        stop.note = c.subject + " · today's pick";
        stop.link = appLink(c.pick);
      } else {
        stop.title = c.subject;
        stop.note = (c.sub.options||[]).length ? (c.sub.options||[]).join(" or ") : (c.sub.note||"");
      }
    } else if(c.type === "manual"){
      stop.note = c.extra ? "extra for today" : (c.page ? "p."+c.page : "extra");
    } else {
      stop.note = (c.sub.book||c.subject) + (c.page ? " · p."+c.page : "");
    }
    return stop;
  });
}

function attachBlock(stop){
  const list = getAttachments(KID, stop.subject, stop.itemId);
  if(!list.length) return "";
  return `<div class="attachWrap">` + list.map(a=>{
    const dk = attachDoneKey(KID, stop.subject, stop.itemId, a.id);
    const done = isDone(dk);
    const href = safeUrl(a.url);
    const label = a.title || a.url || "(link)";
    const inner = href
      ? `<a class="attachLink" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`
      : `<span class="attachLink bad">${esc(label)}</span>`;
    return `<div class="attachRow"><span class="attachCheck${done?' on':''}" data-attachdone="${esc(dk)}"
      title="${a.kind==="video"?"Mark as watched":"Mark as read"}">${done?'✓':''}</span>
      <span>${a.kind==="video"?'📺':'📄'}</span>${inner}</div>`;
  }).join("") + `</div>`;
}

function doneStopHtml(s){
  return `<div class="stop done">
    <div class="sbox" data-toggle="${esc(s.key)}" title="Undo">✓</div>
    <div class="t">${stopLabel(s)}</div>
    <div class="pg">done</div>
  </div>` + attachBlock(s);
}
function nextStopHtml(s){
  return `<div class="stop">
    <div class="sbox" data-toggle="${esc(s.key)}" title="Check it off"></div>
    <div class="t">${stopLabel(s)}</div>
    <div class="pg">${esc(s.note)}</div>
    ${s.link?`<a class="go" href="${esc(s.link)}" target="_blank" rel="noopener">Open →</a>`:""}
  </div>` + attachBlock(s);
}
function nowStopHtml(s, position){
  return `<div class="nowstop">
    <div class="sbox" data-toggle="${esc(s.key)}" title="Check it off"></div>
    <div class="nowcard">
      <div style="flex:1;min-width:0;">
        <div class="kick">You are here · stop ${position} · ${esc(s.subject)}</div>
        <div class="title">${esc(s.title)}</div>
        <div class="meta">${esc(s.note)}${s.link?` · <a href="${esc(s.link)}" target="_blank" rel="noopener">Open it →</a>`:""}</div>
      </div>
      <button class="finish" data-toggle="${esc(s.key)}">✓ Finished</button>
      ${attachBlock(s)}
    </div>
  </div>`;
}

function renderRoute(){
  const stops = buildRoute();
  const done = stops.filter(s=>s.done);
  const left = stops.filter(s=>!s.done);
  const total = stops.length;

  const pct = total ? Math.round(done.length/total*100) : 0;
  document.getElementById("dial").style.background =
    `conic-gradient(#fbbf24 0 ${pct}%, rgba(255,255,255,.2) ${pct}% 100%)`;
  document.getElementById("dialText").textContent = `${done.length}/${total}`;
  // A day marked off has nothing to check off, so "all done / nice work" would be a lie.
  const todayHere = todayISO();
  const offToday = LZ.isDayOff(todayHere);
  const offWhy = offToday ? LZ.dayOffLabel(todayHere) : "";
  document.getElementById("stopsLeft").textContent =
    left.length ? `${left.length} stop${left.length===1?'':'s'} left`
    : (offToday && !total ? "Day off" : "All done!");
  document.getElementById("routeHint").textContent =
    left.length ? `Work down the line — you're at stop ${done.length+1} of ${total}`
    : (offToday && !total ? (offWhy ? "Day off — " + offWhy : "Day off. Nothing to do today.")
                          : "Every stop is checked off. Nice work.");

  let html = done.map(doneStopHtml).join("");
  if(left.length){
    html += nowStopHtml(left[0], done.length+1);
    html += left.slice(1).map(nextStopHtml).join("");
    html += `<div class="endflag"><div class="ic">🎉</div><div class="msg">Finish all ${total} and today's adventure is complete</div></div>`;
  } else if(total){
    html += `<div class="endflag done"><div class="ic">🎉</div><div class="msg">Today's adventure is complete!</div></div>`;
  } else {
    html += `<div class="endflag done"><div class="ic">🌞</div><div class="msg">${offToday
      ? (offWhy ? esc(offWhy) : "Day off") + " — no schoolwork today."
      : "Nothing scheduled today — go outside."}</div></div>`;
  }
  if((CFG.paused||[]).length) html += `<div class="pausednote">Paused for now: ${esc(CFG.paused.join(", "))}</div>`;
  document.getElementById("routeList").innerHTML = html;
}

/* ---------- habits + outings, same keys as kidzone.html ---------- */
let outingEditing = false;
function renderRail(){
  const today = todayISO();
  document.getElementById("habitList").innerHTML = (CFG.habits||[]).map(h=>{
    const k = habitKey(KID, h, today);
    const on = isDone(k);
    return `<div class="rrow${on?' on':''}" data-toggle="${esc(k)}"><div class="rbox">${on?'✓':''}</div><span>${esc(h)}</span></div>`;
  }).join("");

  const ok = outingKey(KID, today);
  const outings = getOutings(ok);
  document.getElementById("outingList").innerHTML = outings.map((o,i)=>
    `<div class="rrow${o.done?' on':''}"><div class="rbox" data-outingtoggle="${esc(ok)}" data-idx="${i}">${o.done?'✓':''}</div>
      <span>${esc(o.text)} 🌳</span><span class="rm" data-outingrm="${esc(ok)}" data-idx="${i}" title="Remove">✕</span></div>`
  ).join("") + (outingEditing
    ? `<input type="text" class="outinginput" id="outingInput" placeholder="Where did you go?">`
    : `<div class="addOuting" data-addouting="1">+ Add an outing</div>`);
}

/* A day counts toward the streak if anything at all got checked off on it. */
function renderStreak(){
  const dates = new Set();
  ["lzm|"+KID+"|", "lzDay|"+KID+"|", "lzManualDone|"+KID+"|"].forEach(pre=>{
    scanKeys(pre).forEach(k=>{ const d = doneDate(k); if(d) dates.add(d); });
  });
  let n = 0;
  const cur = new Date(todayISO()+"T00:00:00");
  if(!dates.has(todayISO())) cur.setDate(cur.getDate()-1); // today still counts as "not broken yet"
  while(dates.has(cur.toISOString().slice(0,10))){ n++; cur.setDate(cur.getDate()-1); }
  document.getElementById("streak").textContent = n>1 ? `🔥 ${n}-day streak` : (n===1 ? "🔥 1 day going" : "Start a streak today");
}

/* ---------- journal: same lzJournal record the Journal tab reads ---------- */
const jEl = document.getElementById("journalInput");
let jTimer = null;
function loadJournal(){
  if(document.activeElement === jEl) return;
  jEl.value = getJournal(journalKey(KID, todayISO()));
}
jEl.addEventListener("input", e=>{
  clearTimeout(jTimer);
  const val = e.target.value;
  jTimer = setTimeout(()=>{
    setJournal(journalKey(KID, todayISO()), val);
    document.getElementById("journalSaved").textContent = "Saved";
  }, 500);
});
jEl.addEventListener("focusout", e=>{
  setJournal(journalKey(KID, todayISO()), e.target.value);
  document.getElementById("journalSaved").textContent = "Saved";
});

document.addEventListener("click", e=>{
  const attach = e.target.closest("[data-attachdone]");
  if(attach){ const k = attach.dataset.attachdone; setDone(k, !isDone(k)); refresh(); return; }
  if(e.target.closest(".attachLink")) return;
  const add = e.target.closest("[data-addouting]");
  if(add){ outingEditing = true; renderRail(); const i = document.getElementById("outingInput"); if(i) i.focus(); return; }
  const rm = e.target.closest("[data-outingrm]");
  if(rm){ const k = rm.dataset.outingrm, arr = getOutings(k); arr.splice(parseInt(rm.dataset.idx,10),1); setOutings(k,arr); refresh(); return; }
  const ot = e.target.closest("[data-outingtoggle]");
  if(ot){ const k = ot.dataset.outingtoggle, i = parseInt(ot.dataset.idx,10), arr = getOutings(k);
    if(arr[i]) arr[i].done = !arr[i].done; setOutings(k,arr); refresh(); return; }
  const tog = e.target.closest("[data-toggle]");
  if(tog){ const k = tog.dataset.toggle; setDone(k, !isDone(k)); refresh(); return; }
});

function saveOutingInput(input){
  const k = outingKey(KID, todayISO());
  const text = input.value.trim();
  if(text){ const arr = getOutings(k); arr.push({text, done:true}); setOutings(k, arr); }
  outingEditing = false;
  refresh();
}
document.addEventListener("focusout", e=>{
  const i = e.target.closest(".outinginput"); if(i) saveOutingInput(i);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("outinginput")) saveOutingInput(e.target);
});

function refresh(){
  ensureRecurringSeeded(KID, todayISO());
  renderRoute();
  renderRail();
  renderStreak();
  loadJournal();
}
document.getElementById("todayLabel").textContent =
  new Date(todayISO()+"T00:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
refresh();

// A sibling iframe (Calendar / Journal tab) writing to the same localStorage fires a
// 'storage' event here, so an undo made over there shows up without a reload. Light poll as
// a fallback, skipped while the outing box or journal is being typed into.
function safeRefresh(){
  const ae = document.activeElement;
  if(ae && (ae.id==="outingInput" || ae.id==="journalInput")) return;
  refresh();
}
window.addEventListener("storage", safeRefresh);
setInterval(safeRefresh, 4000);
</script>
</body>
</html>
