<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Reid's Zone · The Learn Zone</title>
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --reid:#0f766e; --reid-soft:#ccfbf1; --green:#166534; --amber:#b45309;
    --shadow:0 10px 30px rgba(30,41,99,.12); --line:#e2e8f0; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ccfbf1,#f8fafc); display:flex; flex-direction:column; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; flex-wrap:wrap; }
  h1{ font-size:24px; margin:0; color:var(--reid); }
  .back{ text-decoration:none; color:var(--reid); font-weight:800; font-size:13.5px; background:#fff; padding:8px 14px; border-radius:999px; box-shadow:var(--shadow); }
  .tabs{ display:flex; gap:8px; padding:0 18px 12px; }
  .tab{ border:2px solid var(--reid-soft); background:#fff; border-radius:999px; padding:9px 20px; font-weight:800; cursor:pointer; font-size:14.5px; color:var(--muted); }
  .tab.active{ background:var(--reid); border-color:var(--reid); color:#fff; }
  .view-wrap{ flex:1; min-height:0; padding:0 12px 12px; }
  .hide{ display:none !important; }
  iframe{ width:100%; height:100%; border:none; border-radius:18px; box-shadow:var(--shadow); background:#fff; display:block; }

  .split{ display:flex; gap:12px; height:100%; }
  .split-left{ flex:1.3; min-width:0; }
  .split-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
  .donetoday{ background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; max-height:48%; overflow:auto; flex:none; }
  .donetoday h3{ margin:0 0 8px; font-size:15px; color:var(--green); }
  .dt-row{ display:flex; align-items:flex-start; gap:9px; padding:6px 2px; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .dt-row:last-child{ border-bottom:none; }
  .dt-ic{ flex:none; width:20px; height:20px; border-radius:6px; background:var(--green); color:#fff; font-size:12px;
    font-weight:800; display:flex; align-items:center; justify-content:center; }
  .dt-row.dt-note .dt-ic{ background:var(--amber); }
  .dt-subj{ display:block; font-weight:800; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
  .dt-txt{ display:block; font-weight:600; }
  .dt-row.dt-note .dt-txt{ font-style:italic; }
  .donetoday .empty{ color:var(--muted); font-size:13px; padding:6px 2px; }
  .journalbox{ background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .journalbox h3{ margin:0 0 8px; font-size:15px; color:var(--reid); flex:none; }
  .journalbox textarea{ flex:1; width:100%; min-height:60px; font-size:14px; padding:10px; border:1px solid var(--line);
    border-radius:10px; font-family:inherit; resize:none; }
  .journalbox .savedNote{ font-size:11px; color:var(--muted); margin-top:4px; height:14px; flex:none; }

  @media (max-width:760px){
    .split{ flex-direction:column; height:auto; }
    .split-left{ height:55vh; }
    .split-right{ height:55vh; }
    .donetoday{ max-height:200px; }
  }
</style>
</head>
<body>
  <div class="top">
    <h1>🧑‍🎓 Reid's Zone</h1>
    <a class="back" href="index.html">← The Learn Zone</a>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="work">🧭 Today's Adventure</div>
    <div class="tab" data-tab="week">🗂️ Week Preview</div>
    <div class="tab" data-tab="cal">🗓️ My Calendar</div>
    <div class="tab" data-tab="journal">📔 Daily Journal</div>
  </div>
  <div class="view-wrap">
    <div id="viewWork" class="split">
      <div class="split-left"><iframe id="fWork" src="plan/kidzone.html?kid=reid"></iframe></div>
      <div class="split-right">
        <div class="donetoday">
          <h3>✅ Done today</h3>
          <div id="doneTodayList"></div>
        </div>
        <div class="journalbox">
          <h3>📔 Daily Journal</h3>
          <textarea id="journalInput" placeholder="Write about your day..."></textarea>
          <div class="savedNote" id="journalSaved"></div>
        </div>
      </div>
    </div>
    <div id="viewWeek" class="hide" style="height:100%;">
      <iframe id="fWeek" src="plan/week.html?kid=reid"></iframe>
    </div>
    <div id="viewCal" class="hide" style="height:100%;">
      <iframe id="fCalFull" src="plan/calendar.html?kid=reid"></iframe>
    </div>
    <div id="viewJournal" class="hide" style="height:100%;">
      <iframe id="fJournal" src="plan/journal.html?kid=reid"></iframe>
    </div>
  </div>

<script src="plan/curriculum.js"></script>
<script src="plan/lz-common.js"></script>
<script>
const KID = "reid";
const CUR = window.CURRICULUM || {};
const CFG = window.LZ_CONFIG || {paused:[]};
const { dkey, doneDate, doneDatesForSubject, noteKey, getNote, todayISO, isDone, habitKey, outingKey, getOutings,
  journalKey, getJournal, setJournal, manualDoneOn, attachmentsDoneOn } = window.LZ;

document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("viewWork").classList.toggle("hide", t.dataset.tab!=="work");
    document.getElementById("viewWeek").classList.toggle("hide", t.dataset.tab!=="week");
    document.getElementById("viewCal").classList.toggle("hide", t.dataset.tab!=="cal");
    document.getElementById("viewJournal").classList.toggle("hide", t.dataset.tab!=="journal");
  });
});

// A flat "what happened today" list, pulled straight from the same localStorage records
// kidzone.html (in the left iframe) writes to — so checking something off there updates
// this panel without needing its own copy of the checklist UI.
function buildDoneToday(){
  const subs = (CUR[KID]||[]).filter(s=>!(CFG.paused||[]).includes(s.subject));
  const today = todayISO();
  const items = [];
  subs.forEach(sub=>{
    if(sub.kind==="ongoing"){
      if(doneDatesForSubject(KID, sub.subject).includes(today)){
        items.push({subject:sub.subject, icon:"✓", text:"Done today"});
      }
    } else {
      (sub.lessons||[]).forEach(l=>{
        if(doneDate(dkey(KID,sub,l))===today){
          items.push({subject:sub.subject, icon:"✓", text:l.t+(l.p?` (p.${l.p})`:"")});
        }
      });
    }
    const note = getNote(noteKey(KID, sub.subject, today));
    if(note) items.push({subject:sub.subject, icon:"✎", text:note, isNote:true});
  });
  // Teacher-inserted lessons live under their own key prefix, not in sub.lessons, so they
  // need their own pass — otherwise finishing one wouldn't show up here at all.
  manualDoneOn(KID, today).forEach(m=>{
    items.push({subject:m.subject, icon:"✓", text:m.title+(m.page?` (p.${m.page})`:"")});
  });
  // Supplement videos/articles the kid ticked as watched or read.
  attachmentsDoneOn(KID, today).forEach(a=>{
    items.push({subject:a.subject, icon:a.kind==="video"?"📺":"📄", text:a.title});
  });
  (CFG.habits||[]).forEach(h=>{
    if(isDone(habitKey(KID, h, today))) items.push({subject:"Daily habit", icon:"✓", text:h});
  });
  getOutings(outingKey(KID, today)).filter(o=>o.done).forEach(o=>{
    items.push({subject:"Day outing", icon:"🌳", text:o.text});
  });
  return items;
}
function renderDoneToday(){
  const items = buildDoneToday();
  const el = document.getElementById("doneTodayList");
  el.innerHTML = items.length
    ? items.map(it=>`<div class="dt-row${it.isNote?' dt-note':''}"><span class="dt-ic">${it.icon}</span>
        <div><span class="dt-subj">${it.subject}</span><span class="dt-txt">${it.text}</span></div></div>`).join("")
    : `<div class="empty">Nothing checked off yet today.</div>`;
}

// Compact quick-write box, right on the main tab — saves to the exact same lzJournal record
// the full Daily Journal tab (journal.html) reads/writes, so either one always shows the
// latest text.
const journalInputEl = document.getElementById("journalInput");
function loadJournalInput(){
  if(document.activeElement === journalInputEl) return; // don't yank focus while typing
  journalInputEl.value = getJournal(journalKey(KID, todayISO()));
}
let journalSaveTimer = null;
journalInputEl.addEventListener("input", e=>{
  clearTimeout(journalSaveTimer);
  const val = e.target.value;
  journalSaveTimer = setTimeout(()=>{
    setJournal(journalKey(KID, todayISO()), val);
    document.getElementById("journalSaved").textContent = "Saved";
  }, 500);
});
journalInputEl.addEventListener("focusout", e=>{
  setJournal(journalKey(KID, todayISO()), e.target.value);
  document.getElementById("journalSaved").textContent = "Saved";
});

function refreshAll(){
  renderDoneToday();
  loadJournalInput();
}
refreshAll();
// Same-origin localStorage writes made inside an iframe fire a 'storage' event on this
// parent document — that's the main way we notice a new check-off or journal edit. A light
// poll is kept as a fallback since 'storage' event timing/support can vary by browser.
window.addEventListener("storage", refreshAll);
setInterval(refreshAll, 4000);
</script>
</body>
</html>
