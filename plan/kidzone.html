<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Today's Adventure · The Learn Zone</title>
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --accent:#4f46e5; --line:#e2e8f0; --head:#1f3864;
    --ry:#4f46e5; --ry-soft:#eef2ff; --reid:#0f766e; --reid-soft:#ccfbf1; --amber:#b45309; --green:#166534; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#eef2ff,#f8fafc); min-height:100vh; padding:22px 16px 80px; }
  .wrap{ max-width:720px; margin:0 auto; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  h1{ font-size:26px; margin:0; }
  .back{ text-decoration:none; color:var(--accent); font-weight:800; font-size:14px; background:#fff; padding:8px 14px; border-radius:999px; box-shadow:0 8px 24px rgba(30,41,99,.12); }
  .sub{ color:var(--muted); font-size:13px; margin:2px 0 16px; }

  .kidtabs{ display:flex; gap:10px; margin-bottom:18px; }
  .kidtab{ flex:1; text-align:center; padding:14px 10px; border-radius:16px; font-weight:800; font-size:17px; cursor:pointer;
    background:#fff; box-shadow:0 6px 18px rgba(30,41,99,.08); border:3px solid transparent; color:var(--muted); }
  .kidtab .g{ display:block; font-weight:600; font-size:11.5px; margin-top:2px; opacity:.75; }
  .kidtab.active.ry{ border-color:var(--ry); color:var(--ry); background:var(--ry-soft); }
  .kidtab.active.reid{ border-color:var(--reid); color:var(--reid); background:var(--reid-soft); }

  .kidhead{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:16px; color:#fff; margin-bottom:16px; }
  .kidhead.ry{ background:var(--ry); } .kidhead.reid{ background:var(--reid); }
  .kidhead .stat{ margin-left:auto; font-size:15px; font-weight:800; text-align:right; }
  .kidhead .stat small{ display:block; font-weight:500; opacity:.85; font-size:11px; }

  .card{ background:#fff; border-radius:18px; box-shadow:0 8px 24px rgba(30,41,99,.08); padding:16px 18px; margin-bottom:14px; }
  .ch{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .ch .s{ font-weight:800; font-size:18px; } .ch .bk{ font-size:12px; color:var(--muted); font-weight:600; }
  .ch .prog{ margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:700; text-align:right; min-width:120px; }
  .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:3px; }
  .bar>i{ display:block; height:100%; border-radius:999px; background:var(--accent); }

  .lesson{ display:flex; align-items:center; gap:12px; padding:10px 8px; border-radius:12px; cursor:pointer; }
  .lesson.now{ background:#f5f6ff; }
  .lesson:hover{ background:#f8fafc; }
  .lesson .box{ flex:none; width:28px; height:28px; border:2.5px solid #94a3b8; border-radius:8px; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:18px; font-weight:800; }
  .lesson.now .box{ border-color:var(--accent); }
  .lesson.done .box{ background:var(--green); border-color:var(--green); }
  .lesson.done .t{ text-decoration:line-through; color:var(--muted); }
  .lesson .t{ font-size:15.5px; line-height:1.3; font-weight:600; }
  .lesson.now .t{ font-weight:800; font-size:16.5px; }
  .lesson .pg{ font-size:11.5px; color:var(--muted); display:block; margin-top:1px; font-weight:500; }
  .nowpill{ display:inline-block; font-size:9.5px; font-weight:800; background:var(--accent); color:#fff; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .today-lbl{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--green); margin:6px 0 2px 8px; }
  .expandBtn{ font-size:12.5px; font-weight:800; color:var(--accent); cursor:pointer; padding:6px 8px; text-align:center; }
  .expandBtn:hover{ text-decoration:underline; }
  .doneForDay{ font-size:15px; font-weight:800; color:var(--green); background:#f0fdf4; border:2px solid #86efac;
    border-radius:12px; padding:12px; text-align:center; margin-top:4px; }
  .peekBtn{ font-size:13px; font-weight:800; color:var(--muted); cursor:pointer; padding:9px; text-align:center;
    border:2px dashed var(--line); border-radius:10px; margin-top:10px; }
  .peekBtn:hover{ color:var(--accent); border-color:var(--accent); }
  .peek-lbl{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:10px 0 2px 8px; }
  .peekList .lesson{ opacity:.72; }
  .opts{ margin-top:6px; font-size:12.5px; color:var(--amber); }
  .opts b{ color:var(--muted); }
  .todaypick{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 0 8px;
    background:linear-gradient(160deg,#eef2ff,#fff); border:2px solid #c7d2fe; border-radius:12px; padding:11px 14px; }
  .tp-lbl{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .tp-name{ font-size:17px; font-weight:800; color:var(--accent); text-decoration:none; }
  a.tp-name:hover{ text-decoration:underline; }
  .sessboxes{ display:flex; gap:9px; margin-top:9px; }
  .sessboxes .box{ width:26px; height:26px; border:2.5px solid #94a3b8; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; }
  .sessboxes .box.on{ background:var(--green); border-color:var(--green); }
  .empty{ font-size:15px; color:var(--green); font-weight:800; padding:6px 8px; }
  .paused{ background:#fff; border-radius:14px; box-shadow:0 6px 18px rgba(30,41,99,.06); padding:10px 15px; margin-top:18px; font-size:12.5px; color:var(--muted); }
  .habits-card{ background:linear-gradient(160deg,#fffbeb,#fff); border:2px solid #fde68a; }
  .habits-card .ch .s{ color:var(--amber); }
  .lesson.habit .box.on,.lesson.habit.done .box{ background:var(--amber); border-color:var(--amber); }
  .outing-card{ background:linear-gradient(160deg,#f0fdf4,#fff); border:2px solid #86efac; }
  .outing-card .ch .s{ color:var(--green); }
  .lesson.outing-item .box{ cursor:pointer; }
  .rmOuting{ flex:none; width:20px; height:20px; border-radius:50%; background:#fee2e2; color:#b91c1c;
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .addOuting{ font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; padding:8px; text-align:center;
    border:2px dashed #86efac; border-radius:10px; margin-top:4px; }
  .addOuting:hover{ color:var(--green); border-color:var(--green); }
  .outinginput{ width:100%; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
    font-family:inherit; background:#f0fdf4; margin-top:4px; }
  .lesson.manual{ background:#fdf4ff; border:1px dashed #d8b4fe; }
  .lesson.manual.done .box{ background:#a855f7; border-color:#a855f7; }

  /* supplement links (teacher-attached video / article) */
  .lesson{ flex-wrap:wrap; }
  .attachWrap{ flex-basis:100%; margin-top:2px; }
  .attachRow{ display:flex; align-items:center; gap:9px; padding:5px 0 5px 40px; font-size:14px; }
  .attachCheck{ flex:none; width:22px; height:22px; border:2.5px solid #94a3b8; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:800; }
  .attachCheck.on{ background:var(--green); border-color:var(--green); }
  .attachIcon{ flex:none; font-size:15px; }
  .attachLink{ color:var(--accent); text-decoration:none; font-weight:700; }
  .attachLink:hover{ text-decoration:underline; }
  .attachLink.bad{ color:#b91c1c; font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🧭 Today's Adventure</h1>
    <div style="display:flex;gap:8px;" id="kzTopNav">
      <a class="back" id="navPrint" href="print.html">🖨️ Daily sheets</a>
      <a class="back" id="navMaster" href="master.html">📋 Master</a>
      <a class="back" id="navCalendar" href="calendar.html">🗓️ Calendar</a>
      <a class="back" id="navWeek" href="week.html">🗂️ Week</a>
      <a class="back" id="navHome" href="../index.html">← The Learn Zone</a>
    </div>
  </div>
  <div class="sub">Tap a box to check it off — it saves right away and shows up on the Master Tracker too.</div>

  <div class="kidtabs" id="kidtabs"></div>
  <div id="body"></div>
</div>

<script src="curriculum.js"></script>
<script src="lz-common.js"></script>
<script src="lz-sync.js?v=8"></script>
<script>
const CUR = window.CURRICULUM || {};
const CFG = window.LZ_CONFIG || {paused:[]};
const { slug, dkey, skey, dateKey, habitKey, outingKey, isDone, setDone, subjProgress,
  doneLessons, doneDate, todayISO, doneDatesForSubject, getOutings, setOutings,
  ensureRecurringSeeded, getManualLessons, manualDoneKey, combinedQueue, lessonItemId,
  getAttachments, attachDoneKey, safeUrl, dailyPick, appLink, getAllSubjects } = window.LZ;
const KIDS = { ryland:{name:"Ryland",cls:"ry",grade:"6th grade"}, reid:{name:"Reid",cls:"reid",grade:"3rd/4th grade"} };

// ?kid=ryland (or reid) in the URL locks this page to just that kid — no switcher tabs, and
// the Calendar link stays scoped to the same kid. Used by the per-kid hub pages (ry.html /
// reid.html) so each kid only ever sees their own work.
const LOCK_PARAMS = new URLSearchParams(location.search);
const LOCKED = KIDS[LOCK_PARAMS.get("kid")] ? LOCK_PARAMS.get("kid") : null;

let kid = LOCKED || localStorage.getItem("lzKZkid") || "ryland";
if(LOCKED){
  // Embedded inside ry.html/reid.html, which already has its own tab bar for Today's
  // Adventure / Week Preview / Calendar / Journal / back to the Learn Zone up top — this
  // page's own nav row would just be the same links duplicated again right underneath, so
  // drop it entirely rather than only trimming the teacher-only Print/Master links.
  const topNav = document.getElementById("kzTopNav");
  if(topNav) topNav.remove();
}
// How many "recently done" items are expanded per subject, in-memory only (resets on
// reload). Lets a kid scroll back and undo an accidental or rapid-fire check-off.
let expand = {};
function expandFor(kidId, sub){
  const k = kidId+"|"+sub.subject;
  if(!expand[k]) expand[k] = { done:0, peek:false };
  return expand[k];
}
// Which day's outing input is currently open (in-memory only) — keyed by outingKey.
let outingEditing = {};

// A simple daily habits checklist (Go outside, Read a book, etc. — edit the list in
// LZ_CONFIG.habits) shown above the subject cards. Reuses the same [data-k]/isDone/setDone
// checkbox mechanism as everything else, just its own habitKey prefix, and always reflects
// TODAY (no history/undo needed — it naturally resets fresh each new day).
function habitsCard(kidId){
  const habits = CFG.habits || [];
  if(!habits.length) return "";
  const today = todayISO();
  const rows = habits.map(h=>{
    const k = habitKey(kidId, h, today);
    const done = isDone(k);
    return `<div class="lesson habit${done?' done':''}" data-k="${k}">
      <div class="box">${done?'✓':''}</div>
      <div><span class="t">${h}</span></div>
    </div>`;
  }).join("");
  return `<div class="card habits-card">
    <div class="ch"><span class="s">🌞 Daily Habits</span></div>
    ${rows}
  </div>`;
}

// A green box for any outings that day (Zoo trip, Library, a hike — anything off the usual
// routine). A day can have more than one, so this is a small list, with a "+" to add another.
// Each entry has a checkbox: one a kid types here is already checked (done:true, since
// they're describing something that already happened), but a parent can also pre-plan an
// outing for today from calendar.html — that one shows up unchecked so the kid can tick it
// off when it happens.
function dayOutingCard(kidId){
  const k = outingKey(kidId, todayISO());
  const outings = getOutings(k);
  const rows = outings.map((o,i)=>`<div class="lesson outing-item${o.done?' done':''}">
    <div class="box" data-outingtoggle="${k}" data-idx="${i}">${o.done?'✓':''}</div>
    <div style="flex:1;"><span class="t">${o.text}</span></div>
    <span class="rmOuting" data-outingkey="${k}" data-idx="${i}" title="Remove">✕</span>
  </div>`).join("");
  const addRow = outingEditing[k]
    ? `<input type="text" class="outinginput" data-outingkey="${k}" placeholder="Where did you go?">`
    : `<div class="addOuting" data-outingkey="${k}">+ Add an outing</div>`;
  return `<div class="card outing-card">
    <div class="ch"><span class="s">🌳 Day Outing:</span></div>
    ${rows}
    ${addRow}
  </div>`;
}

// Supplement links the teacher attached to a lesson on the Master Tracker (a video to
// watch, an article to read). Read-only here — the kid can open the link and tick its own
// round "watched / read it" circle, but can't add or delete links. Rendered inside the
// lesson row so it stays visually attached; the circle and the link itself are matched in
// the click handler before the row's own [data-k] check, so using them never accidentally
// checks off the whole lesson.
function attachBlock(kidId, subject, itemId){
  const list = getAttachments(kidId, subject, itemId);
  if(!list.length) return "";
  return `<div class="attachWrap">` + list.map(a=>{
    const dk = attachDoneKey(kidId, subject, itemId, a.id);
    const done = isDone(dk);
    const href = safeUrl(a.url);
    const label = a.title || a.url || "(link)";
    const inner = href
      ? `<a class="attachLink" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${escapeAttr(label)}</a>`
      : `<span class="attachLink bad">${escapeAttr(label)}</span>`;
    return `<div class="attachRow">
      <span class="attachCheck${done?' on':''}" data-attachdone="${escapeAttr(dk)}" title="${a.kind==="video"?"Mark as watched":"Mark as read"}">${done?'✓':''}</span>
      <span class="attachIcon">${a.kind==="video"?"📺":"📄"}</span>${inner}
    </div>`;
  }).join("") + `</div>`;
}

function lessonRow(kidId, sub, les, isNow){
  const k = dkey(kidId, sub, les);
  const done = isDone(k) || les.done;
  return `<div class="lesson${done?' done':''}${isNow?' now':''}" data-k="${k}">
    <div class="box">${done?'✓':''}</div>
    <div style="flex:1;"><span class="t">${les.t}${isNow?'<span class="nowpill">now</span>':''}</span><span class="pg">p.${les.p}</span></div>
    ${attachBlock(kidId, sub.subject, lessonItemId(les))}
  </div>`;
}
// Same visual language as lessonRow, but for an "ongoing" subject's day (Math, Typing) —
// checkbox keyed by real calendar date (dateKey), so it's the same record print.html and
// the calendar use, not a separate weekly-tally scheme.
function dayRow(kidId, sub, dateISO, isNow){
  const k = dateKey(kidId, sub.subject, dateISO);
  const done = isDone(k);
  const label = dateISO===todayISO() ? "Today" : new Date(dateISO+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  // An ongoing subject has no per-lesson rows, so its supplements attach to the subject
  // itself and ride along on today's row (matching how master.html attaches them).
  return `<div class="lesson${done?' done':''}${isNow?' now':''}" data-k="${k}">
    <div class="box">${done?'✓':''}</div>
    <div style="flex:1;"><span class="t">${sub.subject}${isNow?'<span class="nowpill">now</span>':''}</span><span class="pg">${label}</span></div>
    ${isNow ? attachBlock(kidId, sub.subject, "subject") : ""}
  </div>`;
}
// A teacher-inserted "extra" lesson slipped into a book subject's queue (e.g. reading a
// library book instead of the workbook) — same look/checkbox mechanics as lessonRow (reuses
// the generic [data-k]/isDone/setDone handler below), just a light purple tint so it reads as
// "not from the book" and no delete button here — that's a teacher-only action on the Master
// Tracker.
function manualLessonRow(kidId, sub, manual, isNow){
  const k = manualDoneKey(kidId, sub.subject, manual.id);
  const done = isDone(k);
  const pageLabel = manual.page ? `p.${manual.page}` : "extra";
  return `<div class="lesson manual${done?' done':''}${isNow?' now':''}" data-k="${k}">
    <div class="box">${done?'✓':''}</div>
    <div style="flex:1;"><span class="t">${manual.title}${isNow?'<span class="nowpill">now</span>':''}</span><span class="pg">${pageLabel}</span></div>
    ${attachBlock(kidId, sub.subject, "m|"+manual.id)}
  </div>`;
}
// Same idea for an ongoing subject's one-off dated task (e.g. "Khan Academy instead" on a
// specific day) — visually matches dayRow but tagged as an "extra".
function manualDayRow(kidId, sub, manual, isNow){
  const k = manualDoneKey(kidId, sub.subject, manual.id);
  const done = isDone(k);
  const label = new Date(manual.date+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  return `<div class="lesson manual${done?' done':''}${isNow?' now':''}" data-k="${k}">
    <div class="box">${done?'✓':''}</div>
    <div style="flex:1;"><span class="t">${manual.title}${isNow?'<span class="nowpill">now</span>':''}</span><span class="pg">${label}</span></div>
    ${attachBlock(kidId, sub.subject, "m|"+manual.id)}
  </div>`;
}

function escapeAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function subjectCard(kidId, sub){
  if(sub.kind==="ongoing"){
    const today = todayISO();
    const allDates = doneDatesForSubject(kidId, sub.subject);
    const pastDates = allDates.filter(d=>d!==today);
    // A teacher may have slipped in a one-off dated task for a past day too (not just today) —
    // fold those into the same "recently done" history, sorted alongside the day checkmarks.
    const pastManual = getManualLessons(kidId, sub.subject).filter(m=>m.date && m.date!==today);
    const historyItems = [
      ...pastDates.map(d=>({type:"day", date:d})),
      ...pastManual.map(m=>({type:"manual", date:m.date, manual:m}))
    ].sort((a,b)=> b.date.localeCompare(a.date)); // most-recent-first for the expand list
    const est = expandFor(kidId, sub);

    let doneSection = "";
    if(historyItems.length){
      const shown = historyItems.slice(0, est.done);
      const more = historyItems.length - shown.length;
      let label, mode;
      if(est.done===0){ label = `▲ Recently done (${historyItems.length})`; mode="expand"; }
      else if(more>0){ label = `▲ Show ${Math.min(5,more)} more`; mode="expand"; }
      else { label = `▲ Hide`; mode="collapse"; }
      doneSection = shown.map(item=> item.type==="day" ? dayRow(kidId,sub,item.date,false) : manualDayRow(kidId,sub,item.manual,false)).join("")
        + `<div class="expandBtn" data-expand="done" data-mode="${mode}" data-key="${kidId}|${sub.subject}">${label}</div>`;
    }
    // Today's teacher-inserted one-off task (e.g. "Khan Academy instead") sits right alongside
    // today's regular day-checkbox, both tagged "now".
    const todayManual = getManualLessons(kidId, sub.subject).filter(m=>m.date===today);
    const todayManualHtml = todayManual.map(m=>manualDayRow(kidId,sub,m,true)).join("");
    // A `pick:"daily"` subject (Learn Zone) isn't a menu — one option is assigned for the
    // day, shown as a single tappable card that opens straight into that app, rather than
    // listing all eight under "Do:" and leaving the choice open every time.
    let optsHtml;
    if(sub.pick === "daily"){
      const choice = dailyPick(kidId, sub.subject, today, sub.options);
      const href = appLink(choice);
      const inner = href
        ? `<a class="tp-name" href="${href}" target="_blank" rel="noopener">${choice} →</a>`
        : `<span class="tp-name">${choice||""}</span>`;
      optsHtml = `<div class="todaypick"><span class="tp-lbl">Today's pick</span>${inner}</div>`
        + (sub.note ? `<div class="opts">${sub.note}</div>` : "");
    } else {
      optsHtml = `<div class="opts"><b>Do:</b> ${(sub.options||[]).join(" or ")}${sub.note?`<br>${sub.note}`:""}</div>`;
    }
    return `<div class="card">
      <div class="ch"><span class="s">${sub.subject}</span>
        <span class="prog">${allDates.length} day${allDates.length===1?'':'s'} done</span></div>
      ${optsHtml}
      ${doneSection}
      ${todayManualHtml}
      ${dayRow(kidId, sub, today, true)}
    </div>`;
  }
  // The upcoming queue mixes real book lessons with any teacher-inserted "extra" lessons
  // (see Master Tracker's "+ Add lesson"), in whatever order the teacher set — same
  // combinedQueue() helper master.html uses, so an inserted/reordered lesson shows up here
  // exactly where the teacher put it, not just on the teacher's own dashboard.
  const queue = combinedQueue(kidId, sub);
  const p = subjProgress(kidId, sub);
  const est = expandFor(kidId, sub);
  const today = todayISO();
  const done = doneLessons(kidId, sub);
  // What got done TODAY stays visible in the main flow (checked, struck through) all day,
  // so a kid (or parent) can see it actually happened — it only rolls into the collapsed
  // "Recently done" history once a new day starts. Static/legacy done records with no
  // date attached count as older history, not "today". Completed manual/"extra" lessons
  // follow the exact same today-vs-older split.
  const doneToday = done.filter(l => doneDate(dkey(kidId,sub,l)) === today);
  const doneOlder = done.filter(l => doneDate(dkey(kidId,sub,l)) !== today);
  const manualEntries = getManualLessons(kidId, sub.subject).filter(m=>!m.date);
  const manualDone = manualEntries.filter(m=>isDone(manualDoneKey(kidId, sub.subject, m.id)));
  const manualDoneToday = manualDone.filter(m=>doneDate(manualDoneKey(kidId,sub.subject,m.id))===today);
  const manualDoneOlder = manualDone.filter(m=>doneDate(manualDoneKey(kidId,sub.subject,m.id))!==today);

  function histRow(item, isNow){ return item.type==="lesson" ? lessonRow(kidId,sub,item.lesson,isNow) : manualLessonRow(kidId,sub,item.manual,isNow); }

  const combinedOlder = [
    ...doneOlder.map(l=>({type:"lesson", date:doneDate(dkey(kidId,sub,l))||"", lesson:l})),
    ...manualDoneOlder.map(m=>({type:"manual", date:doneDate(manualDoneKey(kidId,sub.subject,m.id))||"", manual:m}))
  ].sort((a,b)=> b.date.localeCompare(a.date));
  const combinedToday = [
    ...doneToday.map(l=>({type:"lesson", lesson:l})),
    ...manualDoneToday.map(m=>({type:"manual", manual:m}))
  ];

  // "Recently done" (older than today) — collapsed by default; expands 5 at a time so a
  // kid can scroll back and undo an accidental or rapid-fire check-off from a previous day.
  let doneSection = "";
  if(combinedOlder.length){
    const shownDone = combinedOlder.slice(0, est.done);
    const moreDone = combinedOlder.length - shownDone.length;
    let btnLabel, btnMode;
    if(est.done===0){ btnLabel = `▲ Recently done (${combinedOlder.length})`; btnMode = "expand"; }
    else if(moreDone>0){ btnLabel = `▲ Show ${Math.min(5,moreDone)} more`; btnMode = "expand"; }
    else { btnLabel = `▲ Hide`; btnMode = "collapse"; }
    doneSection = shownDone.map(item=>histRow(item,false)).join("")
      + `<div class="expandBtn" data-expand="done" data-mode="${btnMode}" data-key="${kidId}|${sub.subject}">${btnLabel}</div>`;
  }
  const todaySection = combinedToday.length
    ? `<div class="today-lbl">Done today</div>` + combinedToday.map(item=>histRow(item,false)).join("")
    : "";

  function queueRow(item, isNow){ return item.kind==="real" ? lessonRow(kidId,sub,item.lesson,isNow) : manualLessonRow(kidId,sub,item.manual,isNow); }

  // One lesson at a time, and once it's checked off the NEXT one deliberately doesn't take
  // its place — otherwise finishing a lesson instantly replaces it with more work, which
  // makes it hard to see what was actually accomplished today. So after a lesson is done
  // the card just shows what got done, and the next one waits until tomorrow. A kid who
  // wants to look ahead (or work ahead) can open "Next three" on demand.
  const didSomethingToday = combinedToday.length > 0;
  let body;
  if(queue.length===0){
    body = doneSection + todaySection + `<div class="empty">🎉 All caught up in ${sub.book||sub.subject}!</div>`;
  } else if(didSomethingToday){
    body = doneSection + todaySection + `<div class="doneForDay">✅ ${sub.subject} is done for today!</div>`;
  } else {
    body = doneSection + todaySection + queueRow(queue[0], true);
  }

  // "Next three" peek — starts after whatever is already on screen, so it never repeats the
  // current lesson. Rows stay checkable, so working ahead is still possible on purpose.
  if(queue.length){
    const offset = didSomethingToday ? 0 : 1;
    const peekList = queue.slice(offset, offset + 3);
    if(peekList.length){
      if(est.peek){
        body += `<div class="peek-lbl">Coming up next</div>`
              + `<div class="peekList">` + peekList.map(item=>queueRow(item,false)).join("") + `</div>`
              + `<div class="peekBtn" data-peek="${kidId}|${sub.subject}">▲ Hide</div>`;
      } else {
        body += `<div class="peekBtn" data-peek="${kidId}|${sub.subject}">👀 Next three</div>`;
      }
    }
  }
  return `<div class="card">
    <div class="ch"><span class="s">${sub.subject}</span> <span class="bk">${sub.book||""}</span>
      <span class="prog">${p.done}/${p.total} done<div class="bar"><i style="width:${p.pct}%"></i></div></span></div>
    ${body}
  </div>`;
}

function render(){
  // Auto-add today's recurring activities (karate, etc.) as unchecked outing entries the
  // first time this kid's page is opened today — safe to call every render, it only adds a
  // missing entry, never duplicates one already there.
  ensureRecurringSeeded(kid, todayISO());
  const kidtabsEl = document.getElementById("kidtabs");
  if(LOCKED){
    kidtabsEl.innerHTML = "";
    kidtabsEl.style.display = "none";
  } else {
    kidtabsEl.innerHTML = Object.keys(KIDS).map(id=>{
      const k=KIDS[id];
      return `<div class="kidtab ${k.cls}${kid===id?' active':''}" data-kid="${id}">${k.name}</div>`;
    }).join("");
  }

  const subs = (getAllSubjects(kid)||[]).filter(s=>!(CFG.paused||[]).includes(s.subject));
  let d=0,t=0; subs.forEach(s=>{ if(s.kind!=="ongoing"){ const p=subjProgress(kid,s); d+=p.done; t+=p.total; } });
  const pct = t? Math.round(d/t*100) : 0;
  const cards = subs.map(s=>subjectCard(kid,s)).join("");
  const pausedNote = (CFG.paused&&CFG.paused.length)? `<div class="paused">Paused for now: ${CFG.paused.join(", ")}</div>` : "";

  document.getElementById("body").innerHTML = `
    ${habitsCard(kid)}
    ${dayOutingCard(kid)}
    <div class="kidhead ${KIDS[kid].cls}"><h2 style="margin:0;font-size:19px;">${KIDS[kid].name}'s Studies</h2>
      <span class="stat">${d}/${t} lessons done<small>${pct}% of the way there</small></span></div>
    ${cards}${pausedNote}`;
}

document.addEventListener("click", e=>{
  const tab = e.target.closest(".kidtab");
  if(tab){ kid = tab.dataset.kid; localStorage.setItem("lzKZkid", kid); render(); return; }
  // Supplement links live inside a lesson row, so their circle and the link itself must be
  // handled before the row's generic [data-k] toggle at the bottom — otherwise ticking
  // "watched it" would also check off the whole lesson.
  const attachCheck = e.target.closest("[data-attachdone]");
  if(attachCheck){
    const k = attachCheck.dataset.attachdone;
    setDone(k, !isDone(k));
    render(); return;
  }
  if(e.target.closest(".attachLink")) return; // let the browser open the link, nothing else
  const addOuting = e.target.closest(".addOuting");
  if(addOuting){
    outingEditing[addOuting.dataset.outingkey] = true; render();
    const input = document.querySelector(`.outinginput[data-outingkey="${CSS.escape(addOuting.dataset.outingkey)}"]`);
    if(input) input.focus();
    return;
  }
  const rmOuting = e.target.closest(".rmOuting");
  if(rmOuting){
    const k = rmOuting.dataset.outingkey, idx = parseInt(rmOuting.dataset.idx,10);
    const arr = getOutings(k);
    arr.splice(idx,1);
    setOutings(k, arr);
    render(); return;
  }
  const outingToggle = e.target.closest("[data-outingtoggle]");
  if(outingToggle){
    const k = outingToggle.dataset.outingtoggle, idx = parseInt(outingToggle.dataset.idx,10);
    const arr = getOutings(k);
    if(arr[idx]) arr[idx].done = !arr[idx].done;
    setOutings(k, arr);
    render(); return;
  }
  const peekBtn = e.target.closest(".peekBtn");
  if(peekBtn){
    const st = expand[peekBtn.dataset.peek] || (expand[peekBtn.dataset.peek] = {done:0, peek:false});
    st.peek = !st.peek;
    render(); return;
  }
  const exp = e.target.closest(".expandBtn");
  if(exp){
    const est = expand[exp.dataset.key] || (expand[exp.dataset.key] = {done:0, peek:false});
    est.done = exp.dataset.mode==="collapse" ? 0 : est.done + 5;
    render(); return;
  }
  const box = e.target.closest("[data-k]");
  if(box){ const k=box.dataset.k; setDone(k, !isDone(k)); render(); return; }
});

function saveOutingInput(input){
  const k = input.dataset.outingkey;
  const text = input.value.trim();
  // Typed here, it's already happened — starts checked.
  if(text){ const arr = getOutings(k); arr.push({text, done:true}); setOutings(k, arr); }
  outingEditing[k] = false;
  render();
}
document.addEventListener("focusout", e=>{
  const outingInput = e.target.closest(".outinginput");
  if(outingInput) saveOutingInput(outingInput);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("outinginput")){
    saveOutingInput(e.target);
  }
});

render();

// Undoing something on the calendar (a sibling iframe on the same page, e.g. ry.html's
// mini calendar or the My Calendar tab) writes to this same localStorage — a same-origin
// 'storage' event fires here when that happens, so this page picks up the uncheck/delete
// live instead of only on the next click. Skip refreshing while an outing input is being
// typed into, so we don't yank it out from under the kid mid-sentence; a light poll is kept
// as a fallback since 'storage' event timing/support can vary by browser.
function safeRender(){
  const ae = document.activeElement;
  if(ae && ae.classList && ae.classList.contains("outinginput")) return;
  render();
}
window.addEventListener("storage", safeRender);
setInterval(safeRender, 4000);
</script>
<script src="/stopwatch.js?v=1"></script>
</body>
