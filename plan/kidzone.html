<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>My Work · The Learn Zone</title>
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --accent:#4f46e5; --line:#e2e8f0; --head:#1f3864;
    --ry:#4f46e5; --ry-soft:#eef2ff; --reid:#0f766e; --reid-soft:#ccfbf1; --amber:#b45309; --green:#166534; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#eef2ff,#f8fafc); min-height:100vh; padding:22px 16px 80px; }
  .wrap{ max-width:720px; margin:0 auto; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  h1{ font-size:26px; margin:0; }
  .back{ text-decoration:none; color:var(--accent); font-weight:800; font-size:14px; background:#fff; padding:8px 14px; border-radius:999px; box-shadow:0 8px 24px rgba(30,41,99,.12); }
  .sub{ color:var(--muted); font-size:13px; margin:2px 0 16px; }

  .kidtabs{ display:flex; gap:10px; margin-bottom:18px; }
  .kidtab{ flex:1; text-align:center; padding:14px 10px; border-radius:16px; font-weight:800; font-size:17px; cursor:pointer;
    background:#fff; box-shadow:0 6px 18px rgba(30,41,99,.08); border:3px solid transparent; color:var(--muted); }
  .kidtab .g{ display:block; font-weight:600; font-size:11.5px; margin-top:2px; opacity:.75; }
  .kidtab.active.ry{ border-color:var(--ry); color:var(--ry); background:var(--ry-soft); }
  .kidtab.active.reid{ border-color:var(--reid); color:var(--reid); background:var(--reid-soft); }

  .kidhead{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:16px; color:#fff; margin-bottom:16px; }
  .kidhead.ry{ background:var(--ry); } .kidhead.reid{ background:var(--reid); }
  .kidhead .stat{ margin-left:auto; font-size:15px; font-weight:800; text-align:right; }
  .kidhead .stat small{ display:block; font-weight:500; opacity:.85; font-size:11px; }

  .card{ background:#fff; border-radius:18px; box-shadow:0 8px 24px rgba(30,41,99,.08); padding:16px 18px; margin-bottom:14px; }
  .ch{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .ch .s{ font-weight:800; font-size:18px; } .ch .bk{ font-size:12px; color:var(--muted); font-weight:600; }
  .ch .prog{ margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:700; text-align:right; min-width:120px; }
  .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:3px; }
  .bar>i{ display:block; height:100%; border-radius:999px; background:var(--accent); }

  .notewrap{ margin:4px 0; }
  .noteinput{ width:100%; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
    font-family:inherit; background:#fffbeb; }
  .note-row{ background:#fffbeb; cursor:default; }
  .note-row .t{ font-style:italic; font-weight:600; }
  .note-box{ background:var(--amber); border-color:var(--amber); font-size:14px; }
  .editNote,.undoNote{ flex:none; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:4px; }
  .editNote{ background:#eef2ff; color:var(--accent); }
  .undoNote{ background:#fee2e2; color:#b91c1c; }
  .addNoteRow{ font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; padding:8px; text-align:center;
    border:2px dashed var(--line); border-radius:10px; margin:4px 0; }
  .addNoteRow:hover{ color:var(--accent); border-color:var(--accent); }

  .lesson{ display:flex; align-items:center; gap:12px; padding:10px 8px; border-radius:12px; cursor:pointer; }
  .lesson.now{ background:#f5f6ff; }
  .lesson:hover{ background:#f8fafc; }
  .lesson .box{ flex:none; width:28px; height:28px; border:2.5px solid #94a3b8; border-radius:8px; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:18px; font-weight:800; }
  .lesson.now .box{ border-color:var(--accent); }
  .lesson.done .box{ background:var(--green); border-color:var(--green); }
  .lesson.done .t{ text-decoration:line-through; color:var(--muted); }
  .lesson .t{ font-size:15.5px; line-height:1.3; font-weight:600; }
  .lesson.now .t{ font-weight:800; font-size:16.5px; }
  .lesson .pg{ font-size:11.5px; color:var(--muted); display:block; margin-top:1px; font-weight:500; }
  .nowpill{ display:inline-block; font-size:9.5px; font-weight:800; background:var(--accent); color:#fff; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .upnext-lbl{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:6px 0 2px 8px; }
  .today-lbl{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--green); margin:6px 0 2px 8px; }
  .expandBtn{ font-size:12.5px; font-weight:800; color:var(--accent); cursor:pointer; padding:6px 8px; text-align:center; }
  .expandBtn:hover{ text-decoration:underline; }
  .opts{ margin-top:6px; font-size:12.5px; color:var(--amber); }
  .opts b{ color:var(--muted); }
  .sessboxes{ display:flex; gap:9px; margin-top:9px; }
  .sessboxes .box{ width:26px; height:26px; border:2.5px solid #94a3b8; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; }
  .sessboxes .box.on{ background:var(--green); border-color:var(--green); }
  .empty{ font-size:15px; color:var(--green); font-weight:800; padding:6px 8px; }
  .paused{ background:#fff; border-radius:14px; box-shadow:0 6px 18px rgba(30,41,99,.06); padding:10px 15px; margin-top:18px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>✅ My Work</h1>
    <div style="display:flex;gap:8px;">
      <a class="back" href="print.html">🖨️ Daily sheets</a>
      <a class="back" href="master.html">📋 Master</a>
      <a class="back" href="calendar.html">🗓️ Calendar</a>
      <a class="back" href="../index.html">← The Learn Zone</a>
    </div>
  </div>
  <div class="sub">Tap a box to check it off — it saves right away and shows up on the Master Tracker too.</div>

  <div class="kidtabs" id="kidtabs"></div>
  <div id="body"></div>
</div>

<script src="curriculum.js"></script>
<script src="lz-common.js"></script>
<script>
const CUR = window.CURRICULUM || {};
const CFG = window.LZ_CONFIG || {paused:[]};
const { slug, dkey, skey, dateKey, isDone, setDone, undoneLessons, upcomingLessons, subjProgress,
  doneLessons, doneDate, todayISO, doneDatesForSubject, noteKey, getNote, setNote } = window.LZ;
const KIDS = { ryland:{name:"Ryland",cls:"ry",grade:"6th grade"}, reid:{name:"Reid",cls:"reid",grade:"3rd/4th grade"} };

let kid = localStorage.getItem("lzKZkid") || "ryland";
// How many "recently done" / "coming up" items are expanded per subject, in-memory only
// (resets on reload). Lets a kid undo an accidental or rapid-fire check-off.
let expand = {};
function expandFor(kidId, sub){
  const k = kidId+"|"+sub.subject;
  if(!expand[k]) expand[k] = { done:0, upcoming:3 };
  return expand[k];
}
// Which subject's note is currently being typed into (in-memory only).
let noteEditing = {};

function lessonRow(kidId, sub, les, isNow){
  const k = dkey(kidId, sub, les);
  const done = isDone(k) || les.done;
  return `<div class="lesson${done?' done':''}${isNow?' now':''}" data-k="${k}">
    <div class="box">${done?'✓':''}</div>
    <div><span class="t">${les.t}${isNow?'<span class="nowpill">now</span>':''}</span><span class="pg">p.${les.p}</span></div>
  </div>`;
}
// Same visual language as lessonRow, but for an "ongoing" subject's day (Math, Typing) —
// checkbox keyed by real calendar date (dateKey), so it's the same record print.html and
// the calendar use, not a separate weekly-tally scheme.
function dayRow(kidId, sub, dateISO, isNow){
  const k = dateKey(kidId, sub.subject, dateISO);
  const done = isDone(k);
  const label = dateISO===todayISO() ? "Today" : new Date(dateISO+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  return `<div class="lesson${done?' done':''}${isNow?' now':''}" data-k="${k}">
    <div class="box">${done?'✓':''}</div>
    <div><span class="t">${sub.subject}${isNow?'<span class="nowpill">now</span>':''}</span><span class="pg">${label}</span></div>
  </div>`;
}

function escapeAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
// Renders whatever belongs in the "note slot" for today: the saved note (with edit/delete),
// an open input (while editing), or a quiet prompt to add one. Always placed right before
// the still-to-do row, so it reads as "here's what actually happened today."
function noteSlot(kidId, sub){
  const nkey = noteKey(kidId, sub.subject, todayISO());
  const note = getNote(nkey);
  if(noteEditing[nkey]){
    return `<div class="notewrap" data-notewrap="${nkey}">
      <input type="text" class="noteinput" data-notekey="${nkey}" value="${escapeAttr(note)}" placeholder="What did you do today?"></div>`;
  }
  if(note){
    return `<div class="lesson note-row">
      <div class="box note-box">✎</div>
      <div style="flex:1;"><span class="t">${note}</span></div>
      <span class="editNote" data-editnote="${nkey}" title="Edit note">✎</span>
      <span class="undoNote" data-notekey="${nkey}" data-confirm="Delete this note?" title="Delete note">✕</span>
    </div>`;
  }
  return `<div class="addNoteRow" data-editnote="${nkey}">+ Add a note about today</div>`;
}

function subjectCard(kidId, sub){
  if(sub.kind==="ongoing"){
    const today = todayISO();
    const allDates = doneDatesForSubject(kidId, sub.subject);
    const pastDates = allDates.filter(d=>d!==today).sort().reverse(); // most-recent-first for the expand list
    const est = expandFor(kidId, sub);

    let doneSection = "";
    if(pastDates.length){
      const shown = pastDates.slice(0, est.done);
      const more = pastDates.length - shown.length;
      let label, mode;
      if(est.done===0){ label = `▲ Recently done (${pastDates.length})`; mode="expand"; }
      else if(more>0){ label = `▲ Show ${Math.min(5,more)} more`; mode="expand"; }
      else { label = `▲ Hide`; mode="collapse"; }
      doneSection = shown.map(d=>dayRow(kidId,sub,d,false)).join("")
        + `<div class="expandBtn" data-expand="done" data-mode="${mode}" data-key="${kidId}|${sub.subject}">${label}</div>`;
    }
    return `<div class="card">
      <div class="ch"><span class="s">${sub.subject}</span>
        <span class="prog">${allDates.length} day${allDates.length===1?'':'s'} done</span></div>
      <div class="opts"><b>Do:</b> ${(sub.options||[]).join(" or ")}${sub.note?`<br>${sub.note}`:""}</div>
      ${doneSection}
      ${noteSlot(kidId, sub)}
      ${dayRow(kidId, sub, today, true)}
    </div>`;
  }
  const undone = undoneLessons(kidId, sub);
  const p = subjProgress(kidId, sub);
  const est = expandFor(kidId, sub);
  const done = doneLessons(kidId, sub);
  const today = todayISO();
  // What got done TODAY stays visible in the main flow (checked, struck through) all day,
  // so a kid (or parent) can see it actually happened — it only rolls into the collapsed
  // "Recently done" history once a new day starts. Static/legacy done records with no
  // date attached count as older history, not "today".
  const doneToday = done.filter(l => doneDate(dkey(kidId,sub,l)) === today);
  const doneOlder = done.filter(l => doneDate(dkey(kidId,sub,l)) !== today);

  // "Recently done" (older than today) — collapsed by default; expands 5 at a time so a
  // kid can scroll back and undo an accidental or rapid-fire check-off from a previous day.
  let doneSection = "";
  if(doneOlder.length){
    const shownDone = doneOlder.slice(0, est.done);
    const moreDone = doneOlder.length - shownDone.length;
    let btnLabel, btnMode;
    if(est.done===0){ btnLabel = `▲ Recently done (${doneOlder.length})`; btnMode = "expand"; }
    else if(moreDone>0){ btnLabel = `▲ Show ${Math.min(5,moreDone)} more`; btnMode = "expand"; }
    else { btnLabel = `▲ Hide`; btnMode = "collapse"; }
    doneSection = shownDone.map(l=>lessonRow(kidId,sub,l,false)).join("")
      + `<div class="expandBtn" data-expand="done" data-mode="${btnMode}" data-key="${kidId}|${sub.subject}">${btnLabel}</div>`;
  }
  const todaySection = doneToday.length
    ? `<div class="today-lbl">Done today</div>` + doneToday.map(l=>lessonRow(kidId,sub,l,false)).join("")
    : "";

  // The note slot always sits right before the still-unchecked "now" lesson (or the
  // all-caught-up message), so a note about today reads in context, not detached at the end.
  const note = noteSlot(kidId, sub);

  let body;
  if(undone.length===0){
    body = doneSection + todaySection + note + `<div class="empty">🎉 All caught up in ${sub.book||sub.subject}!</div>`;
  } else {
    const now = undone[0];
    const upcoming = undone.slice(1, 1+est.upcoming);
    const moreUpcoming = undone.length - 1 - upcoming.length;
    body = doneSection + todaySection + note + lessonRow(kidId, sub, now, true);
    if(upcoming.length){
      body += `<div class="upnext-lbl">Coming up</div>` + upcoming.map(l=>lessonRow(kidId,sub,l,false)).join("");
    }
    if(moreUpcoming>0){
      body += `<div class="expandBtn" data-expand="upcoming" data-key="${kidId}|${sub.subject}">▼ Show ${Math.min(10,moreUpcoming)} more</div>`;
    }
  }
  return `<div class="card">
    <div class="ch"><span class="s">${sub.subject}</span> <span class="bk">${sub.book||""}</span>
      <span class="prog">${p.done}/${p.total} done<div class="bar"><i style="width:${p.pct}%"></i></div></span></div>
    ${body}
  </div>`;
}

function render(){
  document.getElementById("kidtabs").innerHTML = Object.keys(KIDS).map(id=>{
    const k=KIDS[id];
    return `<div class="kidtab ${k.cls}${kid===id?' active':''}" data-kid="${id}">${k.name}</div>`;
  }).join("");

  const subs = (CUR[kid]||[]).filter(s=>!(CFG.paused||[]).includes(s.subject));
  let d=0,t=0; subs.forEach(s=>{ if(s.kind!=="ongoing"){ const p=subjProgress(kid,s); d+=p.done; t+=p.total; } });
  const pct = t? Math.round(d/t*100) : 0;
  const cards = subs.map(s=>subjectCard(kid,s)).join("");
  const pausedNote = (CFG.paused&&CFG.paused.length)? `<div class="paused">Paused for now: ${CFG.paused.join(", ")}</div>` : "";

  document.getElementById("body").innerHTML = `
    <div class="kidhead ${KIDS[kid].cls}"><h2 style="margin:0;font-size:19px;">${KIDS[kid].name}'s work</h2>
      <span class="stat">${d}/${t} lessons done<small>${pct}% of the way there</small></span></div>
    ${cards}${pausedNote}`;
}

document.addEventListener("click", e=>{
  const tab = e.target.closest(".kidtab");
  if(tab){ kid = tab.dataset.kid; localStorage.setItem("lzKZkid", kid); render(); return; }
  const editBtn = e.target.closest("[data-editnote]");
  if(editBtn){ noteEditing[editBtn.dataset.editnote] = true; render();
    const input = document.querySelector(`.noteinput[data-notekey="${CSS.escape(editBtn.dataset.editnote)}"]`);
    if(input) input.focus();
    return;
  }
  const undoNote = e.target.closest(".undoNote");
  if(undoNote){
    if(window.confirm(undoNote.dataset.confirm)){
      setNote(undoNote.dataset.notekey, ""); noteEditing[undoNote.dataset.notekey] = false; render();
    }
    return;
  }
  const exp = e.target.closest(".expandBtn");
  if(exp){
    const est = expand[exp.dataset.key] || (expand[exp.dataset.key] = {done:0, upcoming:3});
    if(exp.dataset.expand==="done"){
      est.done = exp.dataset.mode==="collapse" ? 0 : est.done + 5;
    } else {
      est.upcoming += 10;
    }
    render(); return;
  }
  const box = e.target.closest("[data-k]");
  if(box){ const k=box.dataset.k; setDone(k, !isDone(k)); render(); return; }
});

function saveNoteInput(input){
  const k = input.dataset.notekey;
  setNote(k, input.value);
  noteEditing[k] = false;
  render();
}
document.addEventListener("focusout", e=>{
  const input = e.target.closest(".noteinput");
  if(input) saveNoteInput(input);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("noteinput")){
    saveNoteInput(e.target);
  }
});

render();
</script>
<script src="/stopwatch.js?v=1"></script>
</body>
</html>
