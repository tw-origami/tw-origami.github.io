<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Calendar · The Learn Zone</title>
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --accent:#4f46e5; --line:#e2e8f0; --head:#1f3864;
    --ry:#4f46e5; --ry-soft:#eef2ff; --reid:#0f766e; --reid-soft:#ccfbf1; --amber:#b45309; --green:#166534; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#eef2ff,#f8fafc); min-height:100vh; padding:22px 16px 70px; }
  .wrap{ max-width:820px; margin:0 auto; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  h1{ font-size:24px; margin:0; }
  .back{ text-decoration:none; color:var(--accent); font-weight:800; font-size:13.5px; background:#fff; padding:8px 14px; border-radius:999px; box-shadow:0 6px 18px rgba(30,41,99,.12); }

  .controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .kidfilter{ display:flex; gap:6px; }
  .kf{ border:2px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font-weight:800; font-size:13px; cursor:pointer; color:var(--muted); }
  .kf.active.both{ border-color:var(--accent); color:var(--accent); background:var(--ry-soft); }
  .kf.active.ry{ border-color:var(--ry); color:var(--ry); background:var(--ry-soft); }
  .kf.active.reid{ border-color:var(--reid); color:var(--reid); background:var(--reid-soft); }
  .monthnav{ display:flex; align-items:center; gap:10px; }
  .monthnav button{ border:none; background:#fff; box-shadow:0 6px 18px rgba(30,41,99,.1); border-radius:999px; width:34px; height:34px; font-size:16px; font-weight:800; cursor:pointer; color:var(--accent); }
  .monthnav .lbl{ font-weight:800; font-size:16px; min-width:150px; text-align:center; }
  .today-btn{ border:none; background:var(--accent); color:#fff; border-radius:999px; padding:8px 14px; font-weight:800; font-size:12.5px; cursor:pointer; }

  .grid{ background:#fff; border-radius:16px; box-shadow:0 8px 24px rgba(30,41,99,.08); padding:14px; }
  .dow{ display:grid; grid-template-columns:repeat(7,1fr); font-size:11px; font-weight:800; color:var(--muted); text-align:center; margin-bottom:6px; }
  .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .day{ aspect-ratio:1; border-radius:10px; padding:6px; cursor:pointer; border:2px solid transparent; background:#f8fafc; display:flex; flex-direction:column; }
  .day.pad{ background:transparent; cursor:default; }
  .day.today{ border-color:var(--accent); }
  .day.selected{ background:var(--ry-soft); border-color:var(--accent); }
  .day .num{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .day.today .num{ color:var(--accent); }
  .day .dots{ margin-top:auto; display:flex; gap:3px; flex-wrap:wrap; }
  .dot{ width:8px; height:8px; border-radius:50%; }
  .dot.ry{ background:var(--ry); } .dot.reid{ background:var(--reid); } .dot.note{ background:var(--amber); }

  .detail{ background:#fff; border-radius:16px; box-shadow:0 8px 24px rgba(30,41,99,.08); padding:16px 18px; margin-top:16px; }
  .detail h2{ margin:0 0 10px; font-size:16px; }
  .kidsec{ margin-bottom:10px; }
  .kidsec .kn{ font-weight:800; font-size:13.5px; margin-bottom:4px; }
  .kidsec.ry .kn{ color:var(--ry); } .kidsec.reid .kn{ color:var(--reid); }
  .entry{ font-size:13px; line-height:1.5; padding:3px 8px 3px 10px; border-left:3px solid var(--line); margin-bottom:3px;
    display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .undoBtn{ flex:none; width:20px; height:20px; border-radius:50%; background:#fee2e2; color:#b91c1c; font-size:12px;
    font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .undoBtn:hover{ background:#fecaca; }
  .entry.lesson{ border-left-color:var(--green); }
  .entry.ongoing{ border-left-color:var(--accent); }
  .entry.note{ border-left-color:var(--amber); background:#fffbeb; border-radius:0 6px 6px 0; }
  .entry.habit{ border-left-color:var(--amber); }
  .entry.outing{ border-left-color:#16a34a; background:#f0fdf4; border-radius:0 6px 6px 0; }
  .ochk{ display:inline-flex; align-items:center; justify-content:center; flex:none; width:16px; height:16px;
    border:2px solid #86efac; border-radius:5px; font-size:10px; font-weight:900; color:#fff; margin-right:2px;
    cursor:pointer; vertical-align:middle; }
  .ochk.on{ background:var(--green); border-color:var(--green); }
  .addOutingRow{ font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; padding:5px 8px;
    border-left:3px solid #86efac; margin-bottom:3px; }
  .addOutingRow:hover{ color:var(--green); }
  .addOutingBoth{ background:#f0fdf4; border:2px dashed #86efac; border-radius:10px; padding:8px 10px;
    margin-bottom:10px; text-align:center; }
  .addOutingBoth.addOutingRow{ border-left:none; }
  .calOutingInput{ width:100%; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; background:#f0fdf4; }
  .editOuting{ cursor:pointer; font-size:11px; color:var(--muted); margin-left:4px; }
  .editOuting:hover{ color:var(--green); }
  .outingEditInput{ font-size:13px; padding:4px 7px; border:1px solid var(--line); border-radius:7px;
    font-family:inherit; background:#f0fdf4; flex:1; min-width:0; }
  .entry b{ font-weight:800; }
  .empty{ color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🗓️ Calendar</h1>
    <div style="display:flex;gap:8px;">
      <a class="back" id="navWork" href="kidzone.html">🧭 Today's Adventure</a>
      <a class="back" id="navMaster" href="master.html">📋 Master</a>
      <a class="back" id="navWeek" href="week.html">🗂️ Week</a>
      <a class="back" href="../index.html">← The Learn Zone</a>
    </div>
  </div>

  <div class="controls">
    <div class="kidfilter" id="kidfilter"></div>
    <div class="monthnav">
      <button id="prevM">‹</button>
      <span class="lbl" id="monthLbl"></span>
      <button id="nextM">›</button>
    </div>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>

  <div class="grid">
    <div class="dow">${(function(){return "";})()}</div>
    <div class="days" id="days"></div>
  </div>

  <div class="detail" id="detail"></div>
</div>

<script src="curriculum.js"></script>
<script src="lz-common.js"></script>
<script src="lz-sync.js?v=8"></script>
<script>
const CUR = window.CURRICULUM || {};
const CFG = window.LZ_CONFIG || {paused:[], habits:[]};
const { slug, dkey, dateKey, noteKey, outingKey, isDone, setDone, doneDate, getNote, setNote, scanKeys,
  getOutings, setOutings, ensureRecurringSeeded, manualById, parseAttachDoneKey, getAttachments, getAllSubjects } = window.LZ;
function escapeAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
const KIDS = { ryland:{name:"Ryland",cls:"ry"}, reid:{name:"Reid",cls:"reid"} };
// Which day's "+ Add outing" input is currently open (in-memory only) — keyed by outingKey.
let calOutingEditing = {};
// Which specific outing entry is being text-edited (in-memory only) — keyed by "key|idx".
let calEditOuting = {};

// ?kid=ryland (or reid) locks this calendar to just that kid — no filter buttons, and the
// My Work link stays scoped to the same kid. Used by the per-kid hub pages (ry.html / reid.html).
const LOCK_PARAMS = new URLSearchParams(location.search);
const LOCKED = KIDS[LOCK_PARAMS.get("kid")] ? LOCK_PARAMS.get("kid") : null;
if(LOCKED){
  const workNav = document.getElementById("navWork");
  if(workNav) workNav.href = "kidzone.html?kid=" + LOCKED;
  const weekNav = document.getElementById("navWeek");
  if(weekNav) weekNav.href = "week.html?kid=" + LOCKED;
  // The cross-kid Master Tracker is a teacher-only tool (reached from teacher.html instead).
  const masterNav = document.getElementById("navMaster");
  if(masterNav) masterNav.remove();
}

let kidFilter = LOCKED || "both";
let viewDate = new Date(); viewDate.setDate(1); viewDate.setHours(0,0,0,0);
let selected = isoToday();

function isoToday(){ const d=new Date(); return d.toISOString().slice(0,10); }
function iso(d){ return d.toISOString().slice(0,10); }

function findSubjectBySlug(kid, subjSlug){ return getAllSubjects(kid).find(s=>slug(s.subject)===subjSlug); }

// Build a map of iso-date -> [{kid, subject, type, title, page, text}] from everything recorded.
function buildActivityIndex(){
  const byDate = {};
  function add(d, entry){ if(!d) return; (byDate[d] = byDate[d]||[]).push(entry); }

  Object.keys(CUR).forEach(kid=>{
    getAllSubjects(kid).forEach(sub=>{
      if(sub.kind==="book"){
        (sub.lessons||[]).forEach(l=>{
          const k = dkey(kid, sub, l);
          const d = doneDate(k);
          if(d) add(d, {kid, subject:sub.subject, type:"lesson", title:l.t, page:l.p, key:k});
        });
      }
    });
  });
  scanKeys("lzDay|").forEach(k=>{
    const parts = k.split("|"); const kid=parts[1], subjSlug=parts[2], d=parts[3];
    const sub = findSubjectBySlug(kid, subjSlug);
    if(sub && isDone(k)) add(d, {kid, subject:sub.subject, type:"ongoing", key:k});
  });
  scanKeys("lzNote|").forEach(k=>{
    const parts = k.split("|"); const kid=parts[1], subjSlug=parts[2], d=parts[3];
    const sub = findSubjectBySlug(kid, subjSlug);
    const text = getNote(k);
    if(sub && text) add(d, {kid, subject:sub.subject, type:"note", text, key:k});
  });
  scanKeys("lzHabit|").forEach(k=>{
    const parts = k.split("|"); const kid=parts[1], habitSlug=parts[2], d=parts[3];
    if(!isDone(k)) return;
    const habitName = (CFG.habits||[]).find(h=>slug(h)===habitSlug) || habitSlug;
    add(d, {kid, subject:"Daily habit", type:"habit", title:habitName, key:k});
  });
  scanKeys("lzOuting|").forEach(k=>{
    const parts = k.split("|"); const kid=parts[1], d=parts[2];
    getOutings(k).forEach((o, idx)=> add(d, {kid, subject:"Day outing", type:"outing", text:o.text, done:o.done, key:k, idx}));
  });
  // Teacher-inserted lessons (Master Tracker "+ Add lesson"). These live under their own
  // key prefix rather than in sub.lessons, so without this scan a completed one would
  // vanish from the calendar entirely once it dropped out of the upcoming queue.
  scanKeys("lzManualDone|").forEach(k=>{
    const parts = k.split("|"); const kid=parts[1], subjSlug=parts[2], id=parts[3];
    const d = doneDate(k);
    if(!d) return;
    const sub = findSubjectBySlug(kid, subjSlug);
    if(!sub) return;
    const m = manualById(kid, sub.subject, id);
    add(d, {kid, subject:sub.subject, type:"lesson", title:(m&&m.title)||"Extra lesson", page:(m&&m.page)||"", key:k});
  });
  // Supplement links the kid ticked as watched/read.
  scanKeys("lzAttachDone|").forEach(k=>{
    const d = doneDate(k);
    if(!d) return;
    const info = parseAttachDoneKey(k);
    if(!info) return;
    const sub = findSubjectBySlug(info.kid, info.subjSlug);
    if(!sub) return;
    const a = getAttachments(info.kid, sub.subject, info.itemId).find(x=>x.id===info.attachId);
    add(d, {kid:info.kid, subject:sub.subject, type:"link", title:(a&&(a.title||a.url))||"Link",
      kind:(a&&a.kind)||"article", key:k});
  });
  return byDate;
}

function monthMatrix(viewDate){
  const first = new Date(viewDate); first.setDate(1);
  const startDow = first.getDay(); // 0=Sun
  const daysInMonth = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(first.getFullYear(), first.getMonth(), d));
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function renderKidFilter(){
  const el = document.getElementById("kidfilter");
  if(LOCKED){ el.innerHTML = ""; el.style.display = "none"; return; }
  const opts = [["both","Both"],["ryland","Ryland"],["reid","Reid"]];
  el.innerHTML = opts.map(([id,name])=>{
    const cls = id==="ryland"?"ry":id==="reid"?"reid":"both";
    return `<div class="kf ${cls}${kidFilter===id?' active':''}" data-kid="${id}">${name}</div>`;
  }).join("");
}

function renderGrid(){
  document.getElementById("monthLbl").textContent = viewDate.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  const cells = monthMatrix(viewDate);
  // Seed any recurring activities (karate, etc.) for every real day in the visible month, for
  // both kids, before building the index — so opening a month shows them right away instead
  // of waiting for that exact day to be visited on kidzone.html first.
  cells.forEach(d=>{ if(!d) return; const dISO = iso(d); ["ryland","reid"].forEach(kid=>ensureRecurringSeeded(kid, dISO)); });
  const idx = buildActivityIndex();
  const today = isoToday();
  document.getElementById("days").innerHTML = cells.map(d=>{
    if(!d) return `<div class="day pad"></div>`;
    const dISO = iso(d);
    const entries = (idx[dISO]||[]).filter(e=>kidFilter==="both"||e.kid===kidFilter);
    const kidsWithActivity = new Set(entries.filter(e=>e.type!=="note"&&e.type!=="outing").map(e=>e.kid));
    const kidsWithNotes = new Set(entries.filter(e=>e.type==="note"||e.type==="outing").map(e=>e.kid));
    let dots = "";
    ["ryland","reid"].forEach(k=>{ if(kidFilter!=="both"&&kidFilter!==k) return; if(kidsWithActivity.has(k)) dots+=`<span class="dot ${KIDS[k].cls}"></span>`; });
    if(kidsWithNotes.size) dots += `<span class="dot note"></span>`;
    const cls = ["day", dISO===today?"today":"", dISO===selected?"selected":""].join(" ").trim();
    return `<div class="${cls}" data-date="${dISO}"><div class="num">${d.getDate()}</div><div class="dots">${dots}</div></div>`;
  }).join("");
  renderDetail();
}

function renderDetail(){
  const idx = buildActivityIndex();
  const entries = (idx[selected]||[]).filter(e=>kidFilter==="both"||e.kid===kidFilter);
  const dateLabel = new Date(selected+"T00:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  let body = "";
  // A one-click way to plan the same outing for both kids at once (only offered when both
  // are in view) — saves adding it twice under each kid's own section below.
  if(kidFilter==="both"){
    const bothKey = "both:" + selected;
    body += calOutingEditing[bothKey]
      ? `<div class="addOutingBoth"><input type="text" class="calOutingInput" data-outingkey="${bothKey}" placeholder="Plan an outing for both kids..."></div>`
      : `<div class="addOutingBoth addOutingRow" data-outingkey="${bothKey}">+ Add outing for both kids</div>`;
  }
  ["ryland","reid"].forEach(kid=>{
    if(kidFilter!=="both" && kidFilter!==kid) return;
    // Outings first, then daily habits, then everything study-related (lessons, ongoing
    // subjects, per-subject notes) — a stable sort keeps each group's own order intact.
    const groupOrder = {outing:0, habit:1};
    const mine = entries.filter(e=>e.kid===kid)
      .map((e,i)=>({e,i}))
      .sort((a,b)=>{
        const pa = groupOrder[a.e.type] ?? 2, pb = groupOrder[b.e.type] ?? 2;
        return pa!==pb ? pa-pb : a.i-b.i;
      })
      .map(x=>x.e);
    const rows = mine.map(e=>{
      let inner, confirmMsg;
      if(e.type==="lesson"){
        // a teacher-inserted lesson has no book page, so don't render a bare "p."
        inner = `<b>${e.subject}:</b> ${e.title}${e.page?` — p.${e.page}`:""}`;
        confirmMsg = `Undo "${e.title}" for ${e.subject}? It'll go back to not-done.`;
      }
      else if(e.type==="link"){
        inner = `<b>${e.subject}:</b> ${e.kind==="video"?"📺 Watched":"📄 Read"} ${e.title}`;
        confirmMsg = `Mark "${e.title}" as not ${e.kind==="video"?"watched":"read"} again?`;
      }
      else if(e.type==="ongoing"){ inner = `<b>${e.subject}</b> — done`; confirmMsg = `Remove this ${e.subject} check-off for this day?`; }
      else if(e.type==="habit"){ inner = `<b>Habit:</b> ${e.title}`; confirmMsg = `Remove "${e.title}" as done for this day?`; }
      else if(e.type==="outing"){
        const editKey = e.key+"|"+e.idx;
        const chk = `<span class="ochk${e.done?' on':''}" data-key="${e.key}" data-idx="${e.idx}">${e.done?'✓':''}</span>`;
        inner = calEditOuting[editKey]
          ? `${chk} <input type="text" class="outingEditInput" data-key="${e.key}" data-idx="${e.idx}" value="${escapeAttr(e.text)}">`
          : `${chk} <b>Outing:</b> ${e.text} <span class="editOuting" data-key="${e.key}" data-idx="${e.idx}" title="Edit">✎</span>`;
        confirmMsg = `Remove this outing?`;
      }
      else { inner = `<b>${e.subject}:</b> ${e.text}`; confirmMsg = `Delete this note for ${e.subject}?`; }
      const idxAttr = e.idx!==undefined ? ` data-idx="${e.idx}"` : "";
      return `<div class="entry ${e.type}">${inner}
        <span class="undoBtn" data-key="${e.key}" data-type="${e.type}"${idxAttr} data-confirm="${escapeAttr(confirmMsg)}" title="Undo">✕</span>
      </div>`;
    }).join("");
    // A "+ Add outing" prompt is always available for any day (past, today, or future) so a
    // planned outing can be pre-placed ahead of time — it shows up unchecked until it happens.
    const ok = outingKey(kid, selected);
    const addOutingHtml = calOutingEditing[ok]
      ? `<div class="entry"><input type="text" class="calOutingInput" data-outingkey="${ok}" placeholder="Plan an outing for this day..."></div>`
      : `<div class="addOutingRow" data-outingkey="${ok}">+ Add outing</div>`;
    body += `<div class="kidsec ${KIDS[kid].cls}"><div class="kn">${KIDS[kid].name}</div>${addOutingHtml}${rows}</div>`;
  });
  document.getElementById("detail").innerHTML = `<h2>${dateLabel}</h2>${body}`;
}

document.addEventListener("click", e=>{
  const kf = e.target.closest(".kf");
  if(kf){ kidFilter = kf.dataset.kid; renderKidFilter(); renderGrid(); return; }
  const ochk = e.target.closest(".ochk");
  if(ochk){
    const k = ochk.dataset.key, idx = parseInt(ochk.dataset.idx,10);
    const arr = getOutings(k);
    if(arr[idx]){ arr[idx].done = !arr[idx].done; setOutings(k, arr); }
    renderGrid(); return;
  }
  const addOutingRow = e.target.closest(".addOutingRow");
  if(addOutingRow){
    calOutingEditing[addOutingRow.dataset.outingkey] = true;
    renderDetail();
    const input = document.querySelector(`.calOutingInput[data-outingkey="${CSS.escape(addOutingRow.dataset.outingkey)}"]`);
    if(input) input.focus();
    return;
  }
  const editOuting = e.target.closest(".editOuting");
  if(editOuting){
    calEditOuting[editOuting.dataset.key+"|"+editOuting.dataset.idx] = true;
    renderDetail();
    const input = document.querySelector(`.outingEditInput[data-key="${CSS.escape(editOuting.dataset.key)}"][data-idx="${editOuting.dataset.idx}"]`);
    if(input) input.focus();
    return;
  }
  const undo = e.target.closest(".undoBtn");
  if(undo){
    if(window.confirm(undo.dataset.confirm)){
      if(undo.dataset.type==="note") setNote(undo.dataset.key, "");
      else if(undo.dataset.type==="outing"){
        const arr = getOutings(undo.dataset.key);
        const idx = parseInt(undo.dataset.idx,10);
        if(!isNaN(idx)) arr.splice(idx,1);
        setOutings(undo.dataset.key, arr);
      }
      else setDone(undo.dataset.key, false);
      renderGrid();
    }
    return;
  }
  const day = e.target.closest(".day[data-date]");
  if(day){ selected = day.dataset.date; renderGrid(); return; }
});
function saveCalOuting(input){
  const k = input.dataset.outingkey;
  const text = input.value.trim();
  if(text){
    // "both:<date>" isn't a real storage key — it's the signal to write the same planned
    // outing under each kid's own outingKey for that date, so it shows up on each of their
    // individual calendars/checklists independently.
    if(k.indexOf("both:")===0){
      const date = k.slice(5);
      ["ryland","reid"].forEach(kid=>{
        const rk = outingKey(kid, date);
        const arr = getOutings(rk);
        arr.push({text, done:false});
        setOutings(rk, arr);
      });
    } else {
      // Planned from the calendar (not yet lived) — starts unchecked.
      const arr = getOutings(k);
      arr.push({text, done:false});
      setOutings(k, arr);
    }
  }
  calOutingEditing[k] = false;
  renderGrid();
}
function saveOutingEdit(input){
  const k = input.dataset.key, idx = parseInt(input.dataset.idx,10);
  const arr = getOutings(k);
  if(arr[idx]) arr[idx].text = input.value.trim(); // empty text is filtered out by setOutings
  setOutings(k, arr);
  delete calEditOuting[k+"|"+idx];
  renderGrid();
}
document.addEventListener("focusout", e=>{
  const input = e.target.closest(".calOutingInput");
  if(input) saveCalOuting(input);
  const editInput = e.target.closest(".outingEditInput");
  if(editInput) saveOutingEdit(editInput);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("calOutingInput")){
    saveCalOuting(e.target);
  }
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("outingEditInput")){
    saveOutingEdit(e.target);
  }
});
document.getElementById("prevM").onclick = ()=>{ viewDate.setMonth(viewDate.getMonth()-1); renderGrid(); };
document.getElementById("nextM").onclick = ()=>{ viewDate.setMonth(viewDate.getMonth()+1); renderGrid(); };
document.getElementById("todayBtn").onclick = ()=>{ viewDate=new Date(); viewDate.setDate(1); viewDate.setHours(0,0,0,0); selected=isoToday(); renderGrid(); };

renderKidFilter();
renderGrid();
