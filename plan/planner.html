<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Week Planner · The Learn Zone</title>
<style>
  :root{
    --ink:#15213b; --muted:#6b7a99; --faint:#94a3b8; --line:#e4e9f2; --bg:#f2f4f9;
    --ry:#4f46e5; --ry-soft:#eef1ff; --reid:#0f766e; --reid-soft:#e6f7f3;
    --green:#15803d; --amber:#b45309; --red:#be123c;
    --shadow:0 1px 2px rgba(21,33,59,.06), 0 6px 18px rgba(21,33,59,.06);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; }
  button{ font:inherit; color:inherit; }
  a{ color:var(--ry); } a:hover{ color:#3730a3; }

  /* ---- top bar ---- */
  .bar{ display:flex; align-items:center; gap:14px; padding:12px 18px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar h1{ margin:0; font-size:17px; letter-spacing:-.01em; }
  .wknav{ display:flex; align-items:center; gap:4px; }
  .wknav button{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 10px; cursor:pointer; font-weight:700; }
  .wknav button:hover{ background:#f8fafc; }
  .wknav .range{ font-weight:700; font-size:13.5px; padding:0 6px; min-width:150px; text-align:center; }
  .spacer{ flex:1; }
  .sum{ display:flex; gap:8px; }
  .sumcard{ display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:11px; padding:6px 11px 6px 9px; background:#fff; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .sumcard b{ font-size:13px; } .sumcard span{ font-size:12px; color:var(--muted); }
  .sumcard div{ white-space:nowrap; }
  .ghost{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 12px; font-weight:700; font-size:13px; cursor:pointer; }
  .ghost:hover{ background:#f8fafc; }
  .primary{ background:var(--ink); color:#fff; border:1px solid var(--ink); border-radius:9px; padding:7px 13px; font-weight:700; font-size:13px; cursor:pointer; }
  .primary:hover{ background:#0d1729; }

  /* ---- grid: subject rows x day columns, per kid ---- */
  .gridwrap{ flex:1; overflow:auto; padding:12px 0 20px; }
  /* width:max-content lets the grid be as wide as all its week columns put together —
     .gridwrap is the scroller. The old overflow:hidden (there for the rounded corners)
     clipped the timeline to the viewport, so it could never scroll sideways. */
  .gtable{ display:grid; width:max-content; min-width:100%; border-radius:14px; box-shadow:var(--shadow); background:#fff; }
  .hcell{ position:sticky; top:0; z-index:3; background:#fff; border-bottom:1px solid var(--line); border-left:1px dashed var(--line);
    padding:8px 9px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; white-space:nowrap; }
  .hcell.today{ background:#eef1ff; }
  .hcell.off{ background:#fdf6ec; }
  .hcell .dow{ font-weight:800; font-size:13px; letter-spacing:.02em; }
  .hcell .dnum{ font-size:12px; color:var(--muted); }
  .hcell .todaytag{ font-size:9.5px; font-weight:800; background:var(--ry); color:#fff; border-radius:999px; padding:2px 6px; letter-spacing:.04em; }
  .hcell .offwhy{ flex:1 0 100%; border:none; border-bottom:1px dashed #e0c9a0; background:none; font:inherit; color:var(--amber); font-size:11.5px; font-weight:700; padding:2px 0 0; min-width:0; }
  .hcell .offwhy:focus{ outline:none; border-bottom-style:solid; }
  .corner{ position:sticky; top:0; left:0; z-index:5; background:#f4f5fa; border-bottom:1px solid var(--line); border-right:2px solid #d9dced;
    font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .dtools{ margin-left:auto; display:flex; gap:3px; opacity:0; transition:opacity .12s; }
  .hcell:hover .dtools, .hcell.off .dtools{ opacity:1; }
  .dtools button{ border:1px solid var(--line); background:#fff; border-radius:7px; width:22px; height:22px; line-height:1; cursor:pointer; font-size:11px; padding:0; color:var(--muted); }
  .dtools button:hover{ background:#f1f5f9; color:var(--ink); }
  .dtools button.on{ background:var(--amber); border-color:var(--amber); color:#fff; }

  .kidbar{ grid-column:1/-1; display:flex; align-items:center; padding:0; min-height:30px;
    font-weight:800; font-size:13px; letter-spacing:.04em; color:#fff; }
  .kidbar .kidname{ position:sticky; left:0; z-index:3; display:flex; align-items:center; gap:7px;
    padding:7px 14px; white-space:nowrap; }
  .kidbar .kidname::before{ content:""; width:8px; height:8px; border-radius:50%; background:#fff; opacity:.9; }
  /* Sticky subject column: light grey so it reads as a header rail rather than as a cell,
     and so the boundary is obvious once the grid is scrolled sideways. */
  .lbl{ position:sticky; left:0; z-index:2; background:#f4f5fa; border-right:2px solid #d9dced;
    border-top:1px solid var(--line); padding:9px 10px; min-width:0; }
  .lbl .nm{ font-weight:700; font-size:12.5px; padding-left:7px; border-left:3px solid var(--ry); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lbl .meta{ font-size:10.5px; color:var(--muted); margin:4px 0 0 10px; }
  .lbl .bar2{ margin:4px 0 0 10px; width:100px; }

  .cell{ border-top:1px solid var(--line); border-left:1px dashed var(--line); padding:6px; min-height:44px;
    display:flex; flex-direction:column; gap:5px; position:relative; }
  .cell.off{ background:#fbfbfd; }
  /* A day deliberately left empty for this subject (a lesson was pushed off it). Shown,
     because an invisible hole in the flow is impossible to reason about or undo. */
  .donepill{ display:flex; align-items:center; gap:5px; width:100%; border:1px dashed #d7dbe8;
    background:#f8fafc; color:var(--muted); border-radius:9px; padding:4px 8px; cursor:pointer;
    font:inherit; font-size:11px; font-weight:700; text-align:left; }
  .donepill:hover{ background:#eef1ff; border-color:var(--ry); color:var(--ink); }
  .donepill .tick{ color:var(--green); font-weight:900; }
  .donepill .chev{ margin-left:auto; opacity:.7; }
  .donepill.open{ border-style:solid; }
  .cell.gap{ background:repeating-linear-gradient(135deg,#fafbfd,#fafbfd 6px,#f1f3f9 6px,#f1f3f9 12px); }
  .cell .gapclear{ position:absolute; inset:auto 0 0 0; margin:auto; width:max-content;
    border:1px dashed #cbd5e1; background:#fff; color:var(--muted); border-radius:999px;
    font-size:10px; font-weight:700; padding:2px 8px; cursor:pointer; opacity:0; }
  .cell.gap .gapclear{ opacity:.75; position:static; margin:auto; }
  .cell.gap .gapclear:hover{ opacity:1; color:var(--ink); border-color:var(--ry); }
  /* Weeks run together in one scroller, so the Monday column carries the seam. */
  .cell.wkstart, .hcell.wkstart{ border-left:2px solid #c9c4e8; }
  .hcell .wk{ font-size:9.5px; font-weight:800; color:var(--ry); background:#eef1ff;
    border-radius:999px; padding:2px 6px; letter-spacing:.03em; }
  .cell.today{ background:#f7f8ff; }
  .cell.dropping{ background:var(--ry-soft); outline:2px dashed var(--ry); outline-offset:-2px; z-index:1; }
  .cell.dropping.reid{ background:var(--reid-soft); outline-color:var(--reid); }

  /* While a lesson is in hand, every cell of that kid+subject splits into two targets:
     the top half PUSHES (the lesson takes the day, everything there shifts forward) and
     the bottom half ADDS (the day ends up with both). Hidden entirely when not dragging,
     so the grid is unchanged at rest. */
  .dz{ display:none; position:absolute; left:0; right:0; height:50%; z-index:4;
    align-items:center; justify-content:center; font-size:10.5px; font-weight:800;
    letter-spacing:.04em; text-transform:uppercase; border-radius:8px; pointer-events:auto; }
  .dz.push{ top:0; }
  .dz.add{ bottom:0; }
  /* Faintly labelled on every candidate day while dragging, so the two halves are
     discoverable rather than something you find by accident; solid under the cursor. */
  .cell.droppable .dz{ display:flex; color:rgba(51,65,85,.42); background:rgba(148,163,184,.10);
    border:1px dashed rgba(100,116,139,.35); }
  .cell.droppable .dz.hot{ color:#fff; border-style:solid; }
  .dz.push.hot{ background:rgba(79,70,229,.92); border-color:var(--ry); }
  .dz.add.hot{  background:rgba(13,148,136,.92); border-color:#0d9488; }
  .cell.droppable[data-kid="reid"] .dz.push.hot{ background:rgba(21,128,61,.92); }
  .cadd{ position:absolute; top:3px; right:3px; border:none; background:none; color:var(--faint); cursor:pointer; font-size:13px; line-height:1; opacity:0; padding:2px; }
  .cell:hover .cadd{ opacity:1; } .cadd:hover{ color:var(--ink); }

  .card{ position:relative; border:1px solid var(--line); border-left:3px solid var(--ry); border-radius:9px; padding:6px 22px 6px 9px; background:#fff; cursor:grab; }
  .card.reid{ border-left-color:var(--reid); }
  .card:hover{ border-color:#cbd5e1; }
  .card.dragging{ opacity:.35; }
  .card .ttl{ font-size:12.5px; line-height:1.28; display:flex; gap:6px; align-items:flex-start; }
  .card .pin{ color:var(--amber); font-size:10px; }
  .card .pg{ font-size:11px; color:var(--muted); white-space:nowrap; }
  .card .box{ flex:none; width:15px; height:15px; margin-top:1px; border:1.8px solid #b3bdd0; border-radius:4px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; background:#fff; }
  /* Finished work is a record, not something to read closely — set it smaller and keep it
     to one line so a long title can't wrap to three and drag the whole row's height with
     it. The full title stays in the card's tooltip. */
  .card.done{ background:#f7faf8; border-left-color:var(--green); padding:3px 20px 3px 8px; }
  .card.done .box{ background:var(--green); border-color:var(--green); width:13px; height:13px; }
  .card.done .ttl{ font-size:11px; line-height:1.2; align-items:center; }
  .card.done .pg{ font-size:10px; }
  .card.done .ttl span.txt{ text-decoration:line-through; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .card.missed{ border-left-color:var(--red); background:#fff6f8; }
  .card.part{ border-style:dashed; }
  .card .menu{ position:absolute; top:4px; right:4px; border:none; background:none; color:#cbd5e1; cursor:pointer; font-size:13px; line-height:1; padding:2px 3px; border-radius:6px; }
  .card:hover .menu{ color:var(--muted); } .card .menu:hover{ background:#f1f5f9; }
  .card.chip{ cursor:default; background:#fcfcfe; }
  /* ---- subject panel ---- */
  .paused{ font-size:11px; color:var(--amber); font-weight:700; }

  /* ---- popovers & modal ---- */
  .pop{ position:fixed; z-index:50; background:#fff; border:1px solid var(--line); border-radius:11px; box-shadow:0 12px 38px rgba(21,33,59,.18); padding:5px; min-width:172px; }
  .pop button{ display:flex; width:100%; gap:8px; align-items:center; border:none; background:none; text-align:left; padding:7px 9px; border-radius:7px; cursor:pointer; font-size:13px; }
  .pop button:hover{ background:#f1f5f9; }
  .pop hr{ border:none; border-top:1px solid var(--line); margin:4px 2px; }
  .pop .k{ color:var(--faint); font-size:11px; margin-left:auto; }
  .scrim{ position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:#fff; border-radius:16px; box-shadow:0 30px 70px rgba(15,23,42,.3); width:min(520px,100%); max-height:86vh; overflow:auto; padding:18px 20px 16px; }
  .modal h3{ margin:0 0 3px; font-size:16px; } .modal .sub{ color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  .hide{ display:none !important; }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .field label{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input[type=text], select, textarea{ border:1px solid var(--line); border-radius:9px; padding:8px 10px; font:inherit; background:#fff; }
  input[type=text]:focus, select:focus{ outline:2px solid #c7cdfa; outline-offset:-1px; }
  .prow{ display:grid; grid-template-columns:1fr 92px 120px auto; gap:7px; align-items:end; margin-bottom:7px; }
  .prow .x{ border:1px solid var(--line); background:#fff; border-radius:8px; width:30px; height:35px; cursor:pointer; color:var(--red); }
  .mfoot{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .linkish{ border:none; background:none; color:var(--ry); font-weight:700; font-size:12.5px; cursor:pointer; padding:2px 0; }
</style>
</head>
<body>

<div class="bar">
  <h1>Week Planner</h1>
  <div class="wknav">
    <button id="prev" title="Previous week">‹</button>
    <div class="range" id="range"></div>
    <button id="next" title="Next week">›</button>
    <button id="thisweek">Today</button>
  </div>
  <div class="sum" id="sum"></div>
  <div class="spacer"></div>
  <button class="primary" id="addBtn">+ Add lesson</button>
  <a class="ghost" style="text-decoration:none" href="../teacher.html">← Dashboard</a>
</div>

<div class="gridwrap" id="gridwrap"></div>


<script src="curriculum.js?v=3"></script>
<script src="lz-common.js?v=8"></script>
<script src="lz-sync.js?v=16"></script>
<script>
const KIDS = [
  { id:"ryland", name:"Ryland", color:"#4f46e5", cls:"ry" },
  { id:"reid",   name:"Reid",   color:"#0f766e", cls:"reid" }
];
const DOW_LABEL = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const $ = s => document.querySelector(s);

function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function addDays(dateISO,n){ const d=new Date(dateISO+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(dateISO){ const d=new Date(dateISO+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); }
function pretty(dateISO){ const d=new Date(dateISO+"T00:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function dowOf(dateISO){ return new Date(dateISO+"T00:00:00").getDay(); }

// The planner is ONE CONTINUOUS TIMELINE, not a stack of separate week pages: weeks sit
// side by side in a horizontally scrollable grid, so a card can be dragged from Thursday
// straight onto next Monday without the target week having to be "the page you're on".
// Weeks are added on demand as you scroll toward either end.
const WEEKS_BACK = 2;      // weeks rendered before the current one at startup
const WEEKS_FWD = 6;       // ...and after it
const WEEKS_STEP = 2;      // how many to graft on when you scroll near an edge
const WEEKS_MAX = 40;      // stop growing eventually; ~9 months of columns is plenty
let rangeStart = addDays(mondayOf(LZ.todayISO()), -7 * WEEKS_BACK);
let rangeWeeks = WEEKS_BACK + 1 + WEEKS_FWD;
// The week always runs Mon–Sun. Hiding weekends made the timeline lie: a lesson pinned to
// a Saturday still existed but had no column to sit in, and "Today" on a weekend had
// nowhere to scroll to. Seven days, always.
const DAYS_PER_WEEK = 7;

function days(){
  const perWeek = DAYS_PER_WEEK;
  const out = [];
  for(let w=0; w<rangeWeeks; w++){
    const mon = addDays(rangeStart, w*7);
    for(let i=0;i<perWeek;i++) out.push(addDays(mon,i));
  }
  return out;
}
const isMonday = dateISO => dowOf(dateISO) === 1;
const isWeekend = dateISO => LZ.isWeekendISO(dateISO);

const runsOn = (kid, subject, d) => LZ.runsOn(kid, subject, d);
const subjectsFor = kid => LZ.activeSubjects(kid);

/* ---------- build the week's plan ----------------------------------------------------
   The rules for what a day holds now live in lz-common's planDays(), shared with the
   kids' route so the two views cannot drift apart again. This file only decides how the
   result is drawn. */
/* ---------- render -------------------------------------------------------------------- */
let plans = {};
function render(){
  const list = days();
  const today = LZ.todayISO();
  const wrap = $("#gridwrap");
  const scroll = { x: wrap.scrollLeft, y: wrap.scrollTop };
  plans = {}; KIDS.forEach(k=>plans[k.id] = LZ.planDays(k.id, list));


  const table = document.createElement("div");
  table.className = "gtable";
  // Fixed 170px columns rather than 1fr: with a dozen weeks side by side the grid has to be
  // wider than the viewport for the timeline to scroll at all.
  table.style.gridTemplateColumns = `150px repeat(${list.length}, 170px)`;

  const corner = document.createElement("div"); corner.className = "hcell corner"; corner.textContent = "Subject";
  table.appendChild(corner);
  list.forEach(date=>table.appendChild(headerCell(date, today)));

  KIDS.forEach(k=>{
    const bar = document.createElement("div");
    bar.className = "kidbar"; bar.style.background = k.color;
    // The name lives in a sticky child so it stays pinned to the left edge as the
    // timeline scrolls -- otherwise it slides out of view and the band is a blank stripe,
    // leaving no indication of which kid the rows below belong to.
    const nm = document.createElement("span");
    nm.className = "kidname"; nm.textContent = k.name;
    nm.style.background = k.color;
    bar.appendChild(nm);
    table.appendChild(bar);
    subjectsFor(k.id).forEach(sub=>{
      table.appendChild(labelCell(k, sub));
      list.forEach(date=>{
        const cards = (plans[k.id][date]||[]).filter(c=>c.subject===sub.subject);
        table.appendChild(dayCell(k, sub, date, cards, today));
      });
    });
  });

  const widthBefore = wrap.firstChild ? wrap.firstChild.scrollWidth : 0;
  wrap.innerHTML = ""; wrap.appendChild(table);
  renderSummary();
  // Weeks grafted onto the LEFT shift everything right by exactly the width added; without
  // this correction the view would jump backwards every time earlier weeks load in.
  const grew = pendingLeftGrowth ? (table.scrollWidth - widthBefore) : 0;
  pendingLeftGrowth = false;
  wrap.scrollLeft = scroll.x + grew;
  wrap.scrollTop = scroll.y;
  if(!scrolledToTodayOnce){ scrolledToTodayOnce = true; scrollToDate(LZ.todayISO(), "auto"); }
  updateRangeLabel();
}

/* ---------- the continuous timeline: scrolling, and growing at either end ------------- */
// Cells whose finished lessons the teacher has opened up, keyed kid|subject|date.
const expandedCells = new Set();
let pendingLeftGrowth = false;
let scrolledToTodayOnce = false;

const dayMs = d => new Date(d+"T00:00:00").getTime();
// The nearest rendered column to a date, which is not always the date itself: with weekends
// hidden, Saturday and Sunday have no column at all, so "Today" on a Sunday has to land on
// a neighbouring weekday instead of silently doing nothing.
function nearestColumn(dateISO){
  const cols = [...$("#gridwrap").querySelectorAll(".hcell[data-date]")];
  if(!cols.length) return null;
  const t = dayMs(dateISO);
  let best = null, bestDiff = Infinity;
  cols.forEach(c=>{
    const diff = Math.abs(dayMs(c.dataset.date) - t);
    if(diff < bestDiff){ bestDiff = diff; best = c; }
  });
  return { col: best, days: bestDiff / 86400000 };
}
function scrollToDate(dateISO, behavior){
  const wrap = $("#gridwrap");
  let hit = nearestColumn(dateISO);
  if(!hit || hit.days > 6){            // genuinely outside the loaded range — reseat it
    rangeStart = addDays(mondayOf(dateISO), -7 * WEEKS_BACK);
    rangeWeeks = WEEKS_BACK + 1 + WEEKS_FWD;
    render();
    hit = nearestColumn(dateISO);
    if(!hit) return;
  }
  // 150px is the sticky subject column; keep the target just clear of it.
  wrap.scrollTo({ left: Math.max(0, hit.col.offsetLeft - 160), behavior: behavior || "smooth" });
}
// Which week is under the left edge right now — that's the one the label should name.
function visibleWeekStart(){
  const wrap = $("#gridwrap");
  const cols = [...wrap.querySelectorAll(".hcell[data-date]")];
  const edge = wrap.scrollLeft + 160;
  const col = cols.find(c=>c.offsetLeft + c.offsetWidth > edge) || cols[0];
  return col ? mondayOf(col.dataset.date) : rangeStart;
}
function updateRangeLabel(){
  const mon = visibleWeekStart();
  const perWeek = DAYS_PER_WEEK;
  $("#range").textContent = pretty(mon) + " – " + pretty(addDays(mon, perWeek-1));
  renderSummary();
}
function growIfNeeded(){
  const wrap = $("#gridwrap");
  if(rangeWeeks >= WEEKS_MAX) return;
  const nearLeft  = wrap.scrollLeft < 300;
  const nearRight = (wrap.scrollWidth - wrap.scrollLeft - wrap.clientWidth) < 300;
  if(nearLeft){
    pendingLeftGrowth = true;
    rangeStart = addDays(rangeStart, -7 * WEEKS_STEP);
    rangeWeeks += WEEKS_STEP;
    render();
  } else if(nearRight){
    rangeWeeks += WEEKS_STEP;
    render();
  }
}

function headerCell(date, today){
  const off = LZ.isDayOff(date), label = LZ.dayOffLabel(date);
  const d = document.createElement("div");
  d.className = "hcell" + (date===today?" today":"") + (off?" off":"") + (isMonday(date)?" wkstart":"");
  d.dataset.date = date;
  d.innerHTML = `
    <span class="dow">${DOW_LABEL[dowOf(date)]}</span><span class="dnum">${pretty(date)}</span>${date===today?'<span class="todaytag">TODAY</span>':""}${isMonday(date)&&date!==today?`<span class="wk">wk ${pretty(date)}</span>`:""}
    <span class="dtools">
      <button data-act="lighten" title="Push this day's extras to later in the week">⤵</button>
      <button data-act="off" class="${off?"on":""}" title="${off?"Day off — click to switch back on":"Mark day off"}">⊘</button>
    </span>
    ${off?`<input class="offwhy" type="text" value="${escapeHtml(label)}" placeholder="reason (optional)">`:""}`;
  d.querySelectorAll(".dtools button").forEach(b=>{
    b.addEventListener("click", e=>{ e.stopPropagation(); b.dataset.act==="off" ? toggleDayOff(date) : lightenDay(date); });
  });
  const why = d.querySelector(".offwhy");
  if(why) why.addEventListener("change", ()=>LZ.setDayOff(date, true, why.value));
  return d;
}

function labelCell(k, sub){
  const d = document.createElement("div"); d.className = "lbl";
  const p = sub.kind==="book" ? LZ.subjProgress(k.id, sub) : null;
  d.innerHTML = `<div class="nm" style="border-left-color:${k.color}" title="${escapeHtml(sub.subject)}">${escapeHtml(sub.subject)}</div>` +
    (p ? `<div class="bar2"><i style="width:${p.pct}%;background:${k.color}"></i></div><div class="meta">${p.left} left</div>`
       : `<div class="meta">daily</div>`);
  return d;
}

function dayCell(k, sub, date, cards, today){
  const off = LZ.isDayOff(date);
  const d = document.createElement("div");
  const gap = !cards.length && LZ.isSkipped(k.id, sub.subject, date);
  d.className = "cell" + (off?" off":"") + (date===today?" today":"") + (isMonday(date)?" wkstart":"")
    + (gap?" gap":"");
  d.dataset.kid = k.id; d.dataset.subject = sub.subject; d.dataset.date = date;
  if(gap){
    const clear = document.createElement("button");
    clear.className = "gapclear";
    clear.textContent = "no " + sub.subject.toLowerCase();
    clear.title = "Left empty on purpose — click to let the queue fill this day again";
    clear.addEventListener("click", e=>{
      e.stopPropagation();
      LZ.setSkipped(k.id, sub.subject, date, false);
      render();
    });
    d.appendChild(clear);
  }
  const add = document.createElement("button");
  add.className = "cadd"; add.textContent = "+"; add.title = "Add a lesson for " + k.name + " on this day";
  add.addEventListener("click", e=>{ e.stopPropagation(); openAdd({kid:k.id, date, subject:sub.subject}); });
  d.appendChild(add);
  // A day where several lessons were checked off at once (catching up a backlog in one
  // go) used to stack every one of them, and since a grid row is as tall as its tallest
  // cell, one such day stretched the whole subject row down the entire timeline. Past
  // work is reference, not something you act on, so two or more collapse into a single
  // line you can open when you actually want to look.
  const doneCards = cards.filter(c=>c.done);
  const openCards = cards.filter(c=>!c.done);
  const cellKey = k.id+"|"+sub.subject+"|"+date;
  const COLLAPSE_FROM = 2;   // two finished lessons in a day is already enough to bloat a row
  const collapse = doneCards.length >= COLLAPSE_FROM && !expandedCells.has(cellKey);

  openCards.forEach((c,i)=>d.appendChild(cardEl(c, k, date, i)));
  if(collapse){
    const pill = document.createElement("button");
    pill.className = "donepill";
    pill.innerHTML = `<span class="tick">✓</span> ${doneCards.length} done <span class="chev">▸</span>`;
    pill.title = doneCards.map(c=>c.title).join("\n");
    pill.addEventListener("click", e=>{ e.stopPropagation(); expandedCells.add(cellKey); render(); });
    d.appendChild(pill);
  } else {
    doneCards.forEach((c,i)=>d.appendChild(cardEl(c, k, date, openCards.length+i)));
    if(doneCards.length >= COLLAPSE_FROM){
      const pill = document.createElement("button");
      pill.className = "donepill open";
      pill.innerHTML = `<span class="chev">▾</span> hide ${doneCards.length}`;
      pill.addEventListener("click", e=>{ e.stopPropagation(); expandedCells.delete(cellKey); render(); });
      d.appendChild(pill);
    }
  }
  wireDrop(d);
  return d;
}

function cardEl(c, k, date, idx){
  const el = document.createElement("div");
  el.className = "card " + k.cls + (c.done?" done":"") + (c.missed&&!c.done?" missed":"") + (c.part?" part":"") + (c.type==="ongoing"?" chip":"");
  el.draggable = c.type !== "ongoing";
  el.dataset.kid = c.kid; el.dataset.subject = c.subject; el.dataset.itemId = c.itemId||""; el.dataset.date = date; el.dataset.idx = idx;
  // A finished card's title is clipped to one line, so keep the whole thing reachable.
  el.title = (c.title||"") + (c.page ? " · p."+c.page : "");
  el.innerHTML = `
    <div class="ttl"><span class="box">${c.done?"✓":""}</span><span class="txt">${escapeHtml(c.title||"")}</span>${c.page?`<span class="pg">p.${escapeHtml(String(c.page))}</span>`:""}${c.pinned?'<span class="pin" title="Pinned to this day">📌</span>':""}</div>
    <button class="menu" title="Options">⋯</button>`;
  el.querySelector(".box").addEventListener("click", e=>{ e.stopPropagation(); toggleDone(c); });
  el.querySelector(".menu").addEventListener("click", e=>{ e.stopPropagation(); openMenu(e.currentTarget, c); });
  el.addEventListener("dragstart", e=>{
    if(c.type==="ongoing"){ e.preventDefault(); return; }
    drag = c; el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", c.itemId||"");
    // Deferred by a tick on purpose. Revealing the drop halves re-lays out every cell in
    // the grid, and doing that synchronously inside dragstart -- while the browser is
    // still snapshotting the drag image from this very element -- makes the browser
    // abandon the drag outright. Let dragstart finish first.
    setTimeout(()=>{ if(drag) markDroppable(true); }, 0);
  });
  el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); drag=null; markDroppable(false); });
  return el;
}

let drag = null;

// Reveal the two halves on every cell the card in hand could legally land on, so the
// choice is visible the whole time you are dragging rather than only under the cursor.
function markDroppable(on){
  document.querySelectorAll("#gridwrap .cell").forEach(cell=>{
    const ok = on && drag && cell.dataset.kid===drag.kid && cell.dataset.subject===drag.subject;
    cell.classList.toggle("droppable", !!ok);
    if(!ok) cell.querySelectorAll(".dz.hot").forEach(z=>z.classList.remove("hot"));
  });
}
function addDropZones(cell){
  [["push","Push"],["add","Add"]].forEach(([mode,label])=>{
    const z = document.createElement("div");
    z.className = "dz " + mode; z.dataset.mode = mode; z.textContent = label;
    // dragenter AND dragover both have to be cancelled. Chrome is happy with dragover
    // alone, but Safari only treats an element as a drop target if the dragenter was
    // cancelled too -- without it the drop silently never fires and dragging looks broken.
    const allow = e => {
      if(!drag || drag.kid!==cell.dataset.kid || drag.subject!==cell.dataset.subject) return;
      e.preventDefault(); e.stopPropagation();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      z.classList.add("hot");
    };
    z.addEventListener("dragenter", allow);
    z.addEventListener("dragover", allow);
    z.addEventListener("dragleave", ()=>z.classList.remove("hot"));
    z.addEventListener("drop", e=>{
      z.classList.remove("hot");
      if(!drag || drag.kid!==cell.dataset.kid || drag.subject!==cell.dataset.subject) return;
      e.preventDefault(); e.stopPropagation();
      const c = drag;
      drag = null;
      markDroppable(false);
      dropOnDay(c, cell.dataset.date, mode);
    });
    cell.appendChild(z);
  });
}
function wireDrop(cell){
  addDropZones(cell);
  const allowCell = e=>{
    if(!drag || drag.kid !== cell.dataset.kid || drag.subject !== cell.dataset.subject) return;
    e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect="move";
    // classList.add() throws on an empty token, so the reid class is added only when it
    // applies — otherwise every dragover on a Ryland cell raised a SyntaxError and the
    // drop highlight never appeared.
    cell.classList.add("dropping");
    if(cell.dataset.kid==="reid") cell.classList.add("reid");
  };
  cell.addEventListener("dragenter", allowCell);
  cell.addEventListener("dragover", allowCell);
  cell.addEventListener("dragleave", ()=>cell.classList.remove("dropping","reid"));
  cell.addEventListener("drop", e=>{
    cell.classList.remove("dropping","reid");
    if(!drag || drag.kid !== cell.dataset.kid || drag.subject !== cell.dataset.subject) return;
    e.preventDefault();
    moveTo(drag, cell.dataset.date);
  });
}

// Scoped to the week currently under the left edge, not the whole loaded timeline —
// "3/40 this week" across nine rendered weeks would be nonsense.
function weekDays(mon){
  const perWeek = DAYS_PER_WEEK;
  return Array.from({length:perWeek},(_,i)=>addDays(mon,i));
}
function renderSummary(){
  const list = weekDays(visibleWeekStart());
  const wrap = $("#sum"); wrap.innerHTML = "";
  KIDS.forEach(k=>{
    let done=0, total=0, late=0;
    list.forEach(d=>(plans[k.id]&&plans[k.id][d]||[]).forEach(c=>{ total++; if(c.done) done++; else if(c.missed) late++; }));
    const el = document.createElement("div");
    el.className = "sumcard";
    el.innerHTML = `<span class="dot" style="background:${k.color}"></span>
      <div><b>${done}/${total}</b> <span>this week</span>${late?` <span style="color:var(--red);font-weight:700">· ${late} late</span>`:""}</div>`;
    wrap.appendChild(el);
  });
}

/* ---------- actions ------------------------------------------------------------------- */
function toggleDone(c){
  if(c.type==="ongoing"){ LZ.setDone(c.doneKey, !c.done); }
  else if(c.done){ localStorage.removeItem(c.doneKey); }
  else { localStorage.setItem(c.doneKey, c.date); }   // credited to the day it was planned for
  render();
}
// Everything in a subject that is still to do on a given day, other than the card in hand.
function occupantsOn(kid, subject, date, exceptItemId){
  return ((plans[kid] && plans[kid][date]) || [])
    .filter(o=>o.subject===subject && !o.done && o.itemId && o.itemId!==exceptItemId
      && o.type!=="ongoing");   // a daily checkbox isn't a lesson that can be shifted
}
function nextOpenDay(kid, subject, after){
  return days().find(d => d > after && runsOn(kid, subject, d))
      || addDays(after, 1);
}
// Dropping a lesson on a day now means one of two things, chosen by which half of the cell
// it lands on. Previously a drop only ever pinned the dragged lesson, which looked like a
// swap: the day it left got backfilled by the queue and whatever was on the target day got
// bumped somewhere unpredictable.
//
//   push — the dragged lesson takes the day, and whatever was there moves on to the next
//          open day. Anything pinned to the target stops being held there, so the queue
//          re-flows and every later lesson shifts along with it.
//   add  — the day keeps what it had AND gains this one. Cards that were merely flowing
//          onto the day get pinned to it, otherwise the new pin would displace them.
function dropOnDay(c, date, mode){
  // Dropping anything onto a day puts that day back in play — otherwise a gap made by an
  // earlier push would stay a hole even once you deliberately filled it.
  LZ.setSkipped(c.kid, c.subject, date, false);
  const others = occupantsOn(c.kid, c.subject, date, c.itemId);
  others.forEach(o=>{
    const isManualPinned = !!(o.manual && o.manual.date);
    if(mode === "push"){
      if(isManualPinned){
        const arr = LZ.getManualLessons(o.kid, o.subject);
        const m = arr.find(x=>x.id===o.manual.id);
        if(m) m.date = nextOpenDay(o.kid, o.subject, date);
        LZ.setManualLessons(o.kid, o.subject, arr);
      } else if(o.pinned){
        LZ.setAssignedDate(o.kid, o.subject, o.itemId, null);  // free the day up
      }
    } else if(!isManualPinned && !o.pinned){
      LZ.setAssignedDate(o.kid, o.subject, o.itemId, date);    // hold it here alongside
    }
  });
  if(mode === "push") pushTo(c, date); else moveTo(c, date);
}

// Push can't be done by pinning. Pinning the dragged lesson to the day only frees its old
// slot, and the lesson that was there flows straight into it -- which is exactly the swap
// this was meant to replace. A real push has to change the ORDER of the queue: put the
// dragged lesson in the slot the target day represents, and everything from there on
// shifts along by one on its own.
function pushTo(c, date){
  const { kid, sub, subject } = c;
  // A dated one-off belongs to its date, not to the queue, so it just moves.
  if(!sub || (c.manual && c.manual.date)){ moveTo(c, date); return; }

  LZ.setAssignedDate(kid, subject, c.itemId, null);      // it has to flow to be ordered

  // Moving a lesson to a LATER day leaves a hole behind it. Without this the queue simply
  // closes up — the next lesson slides into the day you just emptied, which reads as a
  // swap with the neighbour rather than a push. Marking the day excused for this subject
  // takes it out of the flow so nothing backfills it. Dragging BACKWARD is the opposite
  // case: there the days after genuinely should shift along to close the gap.
  if(c.date && date > c.date) LZ.setSkipped(kid, subject, c.date, true);

  const open = LZ.openDaysFor(kid, sub, days());
  const slot = open.indexOf(date);
  if(slot < 0){ moveTo(c, date); return; }               // not a flow day — pin it instead

  const ids = LZ.combinedQueue(kid, sub).map(x=>x.id);
  const pinned = new Set(ids.filter(id=>LZ.getAssignedDate(kid, subject, id)));
  const flowing = ids.filter(id=>!pinned.has(id));
  const from = flowing.indexOf(c.itemId);
  if(from < 0){ moveTo(c, date); return; }

  flowing.splice(from, 1);
  flowing.splice(Math.min(slot, flowing.length), 0, c.itemId);

  // Rebuild the full order, leaving pinned items in the positions they already hold —
  // only the flowing sequence is being resequenced.
  let f = 0;
  LZ.setOrder(kid, subject, ids.map(id => pinned.has(id) ? id : flowing[f++]));
  render();
}

function moveTo(c, date){
  if(c.type==="manual" && c.manual && c.manual.date){
    const arr = LZ.getManualLessons(c.kid, c.subject);
    const m = arr.find(x=>x.id===c.manual.id); if(m) m.date = date;
    LZ.setManualLessons(c.kid, c.subject, arr);
  } else if(c.done){
    localStorage.setItem(c.doneKey, date);            // re-file a completion under another day
  } else {
    LZ.setAssignedDate(c.kid, c.subject, c.itemId, date);
  }
  render();
}
function unpin(c){
  LZ.setAssignedDate(c.kid, c.subject, c.itemId, null);
  render();
}
function toggleDayOff(date){
  const on = !LZ.isDayOff(date);
  LZ.setDayOff(date, on);
  // Anything explicitly pinned to a day that just went off doesn't sit there stranded —
  // it hops to the next working day. Unpinned work re-flows on its own.
  if(on){
    const list = days();
    const target = list.find(d=>d>date && !LZ.isDayOff(d));
    if(target) KIDS.forEach(k=>{
      (plans[k.id][date]||[]).filter(c=>!c.done && c.itemId).forEach(c=>{
        if(c.manual && c.manual.date){
          const arr = LZ.getManualLessons(c.kid,c.subject); const m = arr.find(x=>x.id===c.manual.id);
          if(m) m.date = target; LZ.setManualLessons(c.kid,c.subject,arr);
        } else if(c.pinned) LZ.setAssignedDate(c.kid, c.subject, c.itemId, target);
      });
    });
  }
  render();
}
// Keep the first two items per kid, pin the rest onto the lightest later days of the week.
function lightenDay(date){
  const list = days();
  KIDS.forEach(k=>{
    const cards = (plans[k.id][date]||[]).filter(c=>!c.done && c.itemId);
    const later = list.filter(d=>d>date && !LZ.isDayOff(d));
    if(!later.length) return;
    const load = {}; later.forEach(d=>load[d] = (plans[k.id][d]||[]).filter(c=>!c.done).length);
    cards.slice(2).forEach(c=>{
      const target = later.slice().sort((a,b)=>load[a]-load[b] || a.localeCompare(b))[0];
      load[target]++;
      if(c.manual && c.manual.date){
        const arr = LZ.getManualLessons(c.kid,c.subject); const m = arr.find(x=>x.id===c.manual.id);
        if(m) m.date = target; LZ.setManualLessons(c.kid,c.subject,arr);
      } else LZ.setAssignedDate(c.kid, c.subject, c.itemId, target);
    });
  });
  render();
}

/* ---------- card menu ------------------------------------------------------------------ */
let pop = null;
function closePop(){ if(pop){ pop.remove(); pop=null; } }
document.addEventListener("click", closePop);
function openMenu(anchor, c){
  closePop();
  const list = days();
  const i = list.indexOf(c.date);
  const el = document.createElement("div");
  el.className = "pop";
  const rows = [];
  if(!c.done && c.type!=="ongoing" && i>=0 && i<list.length-1) rows.push(["→ Push to "+DOW_LABEL[dowOf(list[i+1])], ()=>moveTo(c, list[i+1])]);
  if(!c.done && c.type!=="ongoing") rows.push(["✂️ Split into parts…", ()=>openSplit(c)]);
  if(c.pinned && !c.done) rows.push(["📌 Unpin (auto-schedule)", ()=>unpin(c)]);
  if(c.done) rows.push(["↩︎ Mark not done", ()=>toggleDone(c)]);
  else rows.push(["✓ Mark done", ()=>toggleDone(c)]);
  if(c.type==="ongoing") rows.push(["⊘ Skip "+c.subject+" today", ()=>{ LZ.setSkipped(c.kid,c.subject,c.date,true); render(); }]);
  if(c.type==="manual" && c.manual) rows.push(["🗑 Remove this lesson", ()=>{
    LZ.setAssignedDate(c.kid,c.subject,"m|"+c.manual.id,null);
    LZ.removeManualLesson(c.kid, c.subject, c.manual.id); render();
  }]);
  rows.push(["📎 Material… " + (LZ.getAttachments(c.kid, c.subject, c.itemId).length
    ? "(" + LZ.getAttachments(c.kid, c.subject, c.itemId).length + ")" : ""), ()=>openMaterial(c)]);
  if(c.type==="real" && LZ.getSplitParts(c.kid, c.subject, c.itemId).length)
    rows.push(["↩︎ Undo split", ()=>{ LZ.unsplitLesson(c.kid, c.sub, c.itemId); render(); }]);
  rows.forEach(([label,fn])=>{
    const b = document.createElement("button"); b.textContent = label;
    b.addEventListener("click", e=>{ e.stopPropagation(); closePop(); fn(); });
    el.appendChild(b);
  });
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  el.style.top = Math.min(r.bottom+4, window.innerHeight-el.offsetHeight-8)+"px";
  el.style.left = Math.min(r.left-140, window.innerWidth-el.offsetWidth-8)+"px";
  el.addEventListener("click", e=>e.stopPropagation());
  pop = el;
}

/* ---------- modals ---------------------------------------------------------------------- */
function modal(html){
  const s = document.createElement("div"); s.className="scrim";
  s.innerHTML = `<div class="modal">${html}</div>`;
  s.addEventListener("click", e=>{ if(e.target===s) s.remove(); });
  document.body.appendChild(s);
  return s;
}
function dayOptions(sel){
  return days().map(d=>`<option value="${d}"${d===sel?" selected":""}>${DOW_LABEL[dowOf(d)]} ${pretty(d)}</option>`).join("");
}

function openAdd(pre){
  pre = pre || {};
  const kid = pre.kid || "ryland";
  const s = modal(`
    <h3>Add a lesson</h3>
    <div class="sub">Slips a one-off task into a subject's queue — it shows up on the boy's own page too.</div>
    <div class="field"><label>Who</label><select id="aKid">${KIDS.map(k=>`<option value="${k.id}"${k.id===kid?" selected":""}>${k.name}</option>`).join("")}</select></div>
    <div class="field"><label>Subject</label><select id="aSub"></select></div>
    <div class="field"><label>What to do</label><input type="text" id="aTitle" placeholder="e.g. Read a library book, 20 min"></div>
    <div style="display:grid;grid-template-columns:120px 1fr;gap:10px">
      <div class="field"><label>Page</label><input type="text" id="aPage" placeholder="optional"></div>
      <div class="field"><label>Day</label><select id="aDate"><option value="">Next open day (auto)</option>${dayOptions(pre.date)}</select></div>
    </div>
    <div class="mfoot"><button class="ghost" data-close>Cancel</button><button class="primary" id="aSave">Add lesson</button></div>`);
  const fillSubs = ()=>{
    const k = s.querySelector("#aKid").value;
    s.querySelector("#aSub").innerHTML = subjectsFor(k).map(x=>`<option${x.subject===pre.subject?" selected":""}>${escapeHtml(x.subject)}</option>`).join("");
  };
  fillSubs();
  s.querySelector("#aKid").addEventListener("change", fillSubs);
  s.querySelector("[data-close]").addEventListener("click", ()=>s.remove());
  s.querySelector("#aSave").addEventListener("click", ()=>{
    const k = s.querySelector("#aKid").value, subject = s.querySelector("#aSub").value;
    const title = s.querySelector("#aTitle").value.trim();
    if(!title){ s.querySelector("#aTitle").focus(); return; }
    const page = s.querySelector("#aPage").value.trim(), date = s.querySelector("#aDate").value;
    const sub = subjectsFor(k).find(x=>x.subject===subject);
    if(sub && sub.kind==="ongoing"){
      LZ.addManualLesson(k, subject, {title, page, date: date || LZ.todayISO()});
    } else {
      const id = LZ.addManualLesson(k, subject, {title, page});
      if(date) LZ.setAssignedDate(k, subject, "m|"+id, date);
    }
    s.remove(); render();
  });
  s.querySelector("#aTitle").focus();
}

// Split — two parts by default, page range guessed from the lesson's own page number.
/* ---------- supplement material ---------------------------------------------------------
   Four ways to attach something to a lesson, which differ in WHERE the child ends up:

     link   the address itself, in a new tab. Right for a site you're happy to send them
            to unaccompanied.
     video  a YouTube link, opened through watch.html — the video alone, without the
            sidebar, the comments, or a channel two clicks away.
     paste  text pasted here, saved to the sheet, shown on read.html. Right when the
            source page is unreadable for ads but the words are worth keeping.
     page   a reading page built and committed to the site (these come from me: send the
            URL and I'll produce plan/reading/<name>.html), linked by its path.

   Everything is stored on the existing lzAttach record, so each piece keeps the
   check-off circle it already has on the kids' route.
--------------------------------------------------------------------------------------- */
function openMaterial(c){
  const kidName = (KIDS.find(k=>k.id===c.kid)||{}).name || c.kid;
  const s = modal(`
    <h3>Material for “${escapeHtml(c.title||"")}”</h3>
    <div class="sub">Extra reading or watching alongside the lesson. ${escapeHtml(kidName)} gets
      its own tick next to the lesson on their day.</div>
    <div id="mList"></div>
    <div class="field"><label>How should it open?</label>
      <select id="mMode">
        <option value="link">Open the web page itself, in a new tab</option>
        <option value="video">YouTube video — play it on its own page</option>
        <option value="read">Paste the text — make a reading page</option>
        <option value="page">A reading page already on this site</option>
      </select></div>
    <div class="field"><label>Title</label><input type="text" id="mTitle" placeholder="What is it?"></div>
    <div class="field" id="mUrlField"><label id="mUrlLabel">Address</label>
      <input type="text" id="mUrl" placeholder="https://…"></div>
    <div class="field hide" id="mTextField"><label>Article text</label>
      <textarea id="mText" rows="9" placeholder="Paste the article here. Plain text — blank lines separate paragraphs."></textarea>
      <div class="sub" style="margin:4px 0 0" id="mCount">0 characters</div></div>
    <div class="sub hide" id="mNote" style="margin:-4px 0 10px"></div>
    <div class="mfoot"><button class="ghost" data-close>Close</button><button class="primary" id="mSave">Add it</button></div>`);

  const $$ = q => s.querySelector(q);
  const mode = () => $$("#mMode").value;

  function drawList(){
    const list = LZ.getAttachments(c.kid, c.subject, c.itemId);
    const wrap = $$("#mList");
    if(!list.length){ wrap.innerHTML = ""; return; }
    wrap.innerHTML = `<div class="field"><label>Already attached</label></div>`;
    list.forEach(a=>{
      const row = document.createElement("div");
      row.className = "srow";
      row.style.cssText = "display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)";
      const href = LZ.attachHref(a, "");
      row.innerHTML = `<span>${LZ.attachIcon(a)}</span>
        <a href="${escapeHtml(href)}" target="_blank" rel="noopener" style="flex:1;min-width:0;font-size:12.5px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(a.title || href || "(untitled)")}</a>
        <button class="linkish" style="color:var(--red)">remove</button>`;
      row.querySelector("button").addEventListener("click", ()=>{
        LZ.removeAttachment(c.kid, c.subject, c.itemId, a.id);
        drawList(); render();
      });
      wrap.appendChild(row);
    });
  }

  function syncFields(){
    const m = mode();
    $$("#mTextField").classList.toggle("hide", m !== "read");
    $$("#mUrlField").classList.toggle("hide", m === "read");
    const note = $$("#mNote");
    if(m === "video"){
      $$("#mUrlLabel").textContent = "YouTube link";
      $$("#mUrl").placeholder = "https://www.youtube.com/watch?v=…";
      note.textContent = "Plays on its own page — no sidebar, no comments. YouTube still shows its own suggestions once a video ends; that can't be turned off.";
    } else if(m === "page"){
      $$("#mUrlLabel").textContent = "Path on this site";
      $$("#mUrl").placeholder = "reading/rome-aqueducts.html";
      note.textContent = "For a reading page built from a messy source. Ask for one and paste the path you're given.";
    } else if(m === "read"){
      note.textContent = "Saved to your sheet and shown as a clean reading page. Plain text only — images and formatting are dropped.";
    } else {
      $$("#mUrlLabel").textContent = "Address";
      $$("#mUrl").placeholder = "https://…";
      note.textContent = "Opens the real page in a new tab, ads and all.";
    }
    note.classList.remove("hide");
  }
  $$("#mMode").addEventListener("change", syncFields);
  $$("#mText").addEventListener("input", ()=>{
    const n = $$("#mText").value.length;
    $$("#mCount").textContent = n.toLocaleString() + " characters" + (n > 45000 ? " — too long, trim it" : "");
  });
  syncFields(); drawList();

  $$("#mSave").addEventListener("click", async ()=>{
    const m = mode();
    const title = $$("#mTitle").value.trim();
    const btn = $$("#mSave");

    if(m === "read"){
      const text = $$("#mText").value.trim();
      if(!text){ $$("#mText").focus(); return; }
      if(text.length > 45000){ $$("#mCount").textContent = "Too long — trim it under 45,000 characters."; return; }
      btn.disabled = true; btn.textContent = "Saving…";
      const docId = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const ok = await saveDoc(docId, title || "Reading", "", text, pct=>{ btn.textContent = "Saving… " + pct + "%"; });
      btn.disabled = false; btn.textContent = "Add it";
      if(!ok){ $$("#mCount").textContent = "Couldn't save it — check the connection and try again."; return; }
      LZ.addAttachment(c.kid, c.subject, c.itemId, { title: title || "Reading", kind:"article", mode:"read", doc: docId });
    } else if(m === "page"){
      const path = $$("#mUrl").value.trim().replace(/^\/+/, "");
      if(!path){ $$("#mUrl").focus(); return; }
      LZ.addAttachment(c.kid, c.subject, c.itemId, { title: title || path, kind:"article", mode:"read", page: path });
    } else if(m === "video"){
      const url = $$("#mUrl").value.trim();
      if(!LZ.youTubeId(url)){ $$("#mUrl").focus(); $$("#mNote").textContent = "That doesn't look like a YouTube link."; return; }
      LZ.addAttachment(c.kid, c.subject, c.itemId, { title: title || "Video", kind:"video", mode:"video", url });
    } else {
      const url = $$("#mUrl").value.trim();
      if(!/^https?:\/\//i.test(url)){ $$("#mUrl").focus(); $$("#mNote").textContent = "Needs to start with http:// or https://"; return; }
      LZ.addAttachment(c.kid, c.subject, c.itemId, { title: title || url, kind: LZ.guessAttachKind(url), mode:"link", url });
    }
    $$("#mTitle").value = ""; $$("#mUrl").value = ""; $$("#mText").value = "";
    $$("#mCount").textContent = "0 characters";
    drawList(); render();
  });
}

// An article is far too big for one request: values reach Apps Script as GET query
// parameters, so the text goes up in numbered pieces and the backend reassembles it.
// Sequentially, because they all write the same row.
async function saveDoc(id, title, source, text, onProgress){
  const base = (window.LZSYNC && window.LZSYNC.url) || "";
  if(!base) return false;
  const CHUNK = 1200;
  const total = Math.max(1, Math.ceil(text.length / CHUNK));
  for(let i = 0; i < total; i++){
    const part = text.slice(i * CHUNK, (i + 1) * CHUNK);
    const url = base + (base.indexOf("?") >= 0 ? "&" : "?") +
      "action=docput&id=" + encodeURIComponent(id) +
      "&seq=" + i + "&total=" + total +
      (i === 0 ? "&title=" + encodeURIComponent(title) + "&source=" + encodeURIComponent(source||"") : "") +
      "&chunk=" + encodeURIComponent(part) + "&_=" + Date.now() + "." + i;
    let j = null;
    try { j = await fetch(url, { cache:"no-store" }).then(r=>r.json()); } catch(e){ return false; }
    if(!j || !j.ok) return false;
    if(onProgress) onProgress(Math.round(((i + 1) / total) * 100));
  }
  return true;
}

function openSplit(c){
  const base = String(c.page||"").trim();
  const s = modal(`
    <h3>Split “${escapeHtml(c.title||"")}”</h3>
    <div class="sub">Each part becomes its own checkbox on ${KIDS.find(k=>k.id===c.kid).name}'s page. The original lesson closes out when every part is done.</div>
    <div id="parts"></div>
    <button class="linkish" id="addPart">+ another part</button>
    <div class="mfoot"><button class="ghost" data-close>Cancel</button><button class="primary" id="sSave">Split it</button></div>`);
  const wrap = s.querySelector("#parts");
  const addRow = (n, date)=>{
    const row = document.createElement("div");
    row.className = "prow";
    row.innerHTML = `
      <div class="field" style="margin:0"><label>Part ${n}</label><input type="text" value="${escapeHtml(c.title||"")} — part ${n}"></div>
      <div class="field" style="margin:0"><label>Page</label><input type="text" value="${escapeHtml(base)}"></div>
      <div class="field" style="margin:0"><label>Day</label><select>${dayOptions(date)}</select></div>
      <button class="x" title="Remove">×</button>`;
    row.querySelector(".x").addEventListener("click", ()=>{ row.remove(); renumber(); });
    wrap.appendChild(row);
  };
  const renumber = ()=>wrap.querySelectorAll(".prow").forEach((r,i)=>r.querySelector("label").textContent = "Part "+(i+1));
  const list = days(), start = Math.max(0, list.indexOf(c.date));
  addRow(1, list[start]); addRow(2, list[Math.min(start+1, list.length-1)]);
  s.querySelector("#addPart").addEventListener("click", ()=>{ addRow(wrap.children.length+1, list[Math.min(start+wrap.children.length, list.length-1)]); });
  s.querySelector("[data-close]").addEventListener("click", ()=>s.remove());
  s.querySelector("#sSave").addEventListener("click", ()=>{
    const parts = [...wrap.querySelectorAll(".prow")].map(r=>{
      const [t,p] = r.querySelectorAll("input");
      return { title:t.value.trim(), page:p.value.trim(), date:r.querySelector("select").value };
    }).filter(p=>p.title);
    if(parts.length < 2) return;
    if(c.type==="manual"){ // splitting an already-inserted lesson: replace it with the parts
      parts.forEach(p=>{
        const id = LZ.addManualLesson(c.kid, c.subject, {title:p.title, page:p.page, date: c.manual.date ? p.date : ""});
        if(!c.manual.date) LZ.setAssignedDate(c.kid, c.subject, "m|"+id, p.date);
      });
      LZ.setAssignedDate(c.kid, c.subject, "m|"+c.manual.id, null);
      LZ.removeManualLesson(c.kid, c.subject, c.manual.id);
    } else {
      LZ.splitLesson(c.kid, c.sub, c.itemId, parts);
      LZ.setAssignedDate(c.kid, c.subject, c.itemId, null);
    }
    s.remove(); render();
  });
}

function escapeHtml(x){ return String(x).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ---------- chrome ---------------------------------------------------------------------- */
// Prev/next now SCROLL the timeline by a week rather than swapping which week is on
// screen, so the weeks either side stay visible and remain valid drop targets mid-drag.
$("#prev").addEventListener("click", ()=>scrollToDate(addDays(visibleWeekStart(),-7)));
$("#next").addEventListener("click", ()=>scrollToDate(addDays(visibleWeekStart(), 7)));
$("#thisweek").addEventListener("click", ()=>scrollToDate(LZ.todayISO()));

// Grow the timeline as either end comes into view, and keep the label in step. rAF-gated
// so a flick doesn't re-render per scroll event.
let scrollTick = false;
$("#gridwrap").addEventListener("scroll", ()=>{
  if(scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(()=>{ scrollTick = false; updateRangeLabel(); growIfNeeded(); });
});

// Dragging to a week that's off-screen: nudge the timeline when the pointer reaches an edge.
let edgeTimer = null;
$("#gridwrap").addEventListener("dragover", e=>{
  const wrap = $("#gridwrap"), r = wrap.getBoundingClientRect();
  const dx = e.clientX - r.left < 90 ? -22 : (r.right - e.clientX < 90 ? 22 : 0);
  if(!dx){ clearInterval(edgeTimer); edgeTimer = null; return; }
  if(edgeTimer) return;
  edgeTimer = setInterval(()=>{ wrap.scrollLeft += dx; }, 16);
});
["dragleave","drop","dragend"].forEach(ev=>
  $("#gridwrap").addEventListener(ev, ()=>{ clearInterval(edgeTimer); edgeTimer = null; }));
$("#addBtn").addEventListener("click", ()=>openAdd({}));
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowLeft") $("#prev").click();
  if(e.key==="ArrowRight") $("#next").click();
  if(e.key==="Escape"){ closePop(); document.querySelectorAll(".scrim").forEach(x=>x.remove()); }
});
render();
</script>
