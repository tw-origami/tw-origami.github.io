<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading · The Learn Zone</title>
<!--
  A reading page: one article, set for reading, nothing else on the screen.

  ?doc=<id>  pulls text stored in the sheet's "docs" tab — what the Teacher Dashboard
             saves when an article is pasted in.

  Articles built from a messy source page are committed to the site as their own files
  under plan/reading/ instead, and linked directly; they don't come through here.

  The stored body is treated as PLAIN TEXT and escaped before display. Nothing pasted
  into the dashboard can put markup — let alone a script — onto this page.
-->
<style>
  :root{ --ink:#1e2338; --muted:#6b7280; --line:#e6e8f0; --ry:#4f46e5; --paper:#fffdf8; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#f2f3f7; color:var(--ink);
    font:17px/1.7 Georgia,"Iowan Old Style","Times New Roman",serif; }
  header{ background:#fff; border-bottom:1px solid var(--line); padding:10px 18px;
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .back{ color:var(--ry); text-decoration:none; font-weight:700; font-size:13.5px;
    border:1px solid #dfe3f5; border-radius:999px; padding:7px 14px; white-space:nowrap; }
  .back:hover{ background:#eef1ff; }
  .src{ margin-left:auto; font-size:12px; color:var(--muted); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; max-width:42%; }
  .src a{ color:var(--muted); }
  main{ max-width:680px; margin:0 auto; padding:34px 22px 80px; background:var(--paper);
    min-height:100vh; box-shadow:0 0 40px rgba(30,41,99,.06); }
  h1{ font-size:30px; line-height:1.22; margin:0 0 6px; }
  .meta{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:12.5px; color:var(--muted); margin-bottom:26px; }
  p{ margin:0 0 1.15em; }
  .state{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--muted); font-size:14.5px; }
  .state b{ color:var(--ink); }
  @media (max-width:640px){ body{ font-size:16.5px; } main{ padding:24px 18px 70px; } h1{ font-size:25px; } }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="../ry.html">← Back to my day</a>
  <span class="src" id="src"></span>
</header>
<main>
  <h1 id="title">Reading</h1>
  <div class="meta" id="meta"></div>
  <div id="body"><p class="state">Loading…</p></div>
</main>

<script>window.LZ_SYNC_PASSIVE = 1;</script>
<script src="lz-sync.js?v=16"></script>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const id = (qs.get("doc") || "").trim();
  const kid = (qs.get("kid") || "").trim();
  if(kid === "reid" || kid === "ryland"){
    document.getElementById("back").href = "../" + (kid === "reid" ? "reid.html" : "ry.html");
  }
  const bodyEl = document.getElementById("body");
  const say = html => { bodyEl.innerHTML = '<p class="state">' + html + '</p>'; };

  if(!/^[\w-]{1,40}$/.test(id)){
    say('<b>Nothing to read here.</b><br>This page needs a document id.');
    return;
  }
  const base = (window.LZSYNC && window.LZSYNC.url) || "";
  if(!base){ say('<b>Reading is unavailable.</b><br>The sync backend isn\'t configured.'); return; }

  const url = base + (base.indexOf("?") >= 0 ? "&" : "?") +
    "action=doc&id=" + encodeURIComponent(id) + "&_=" + Date.now();

  fetch(url, { cache: "no-store" })
    .then(r => r.json())
    .then(j => {
      if(!j || !j.ok){ say('<b>Couldn\'t find that reading.</b><br>It may have been removed.'); return; }
      const title = j.title || "Reading";
      document.getElementById("title").textContent = title;
      document.title = title + " · The Learn Zone";
      // Only ever show a real web address as the source. Anything else (a "javascript:"
      // URL, a stray note) is dropped rather than displayed as if it were where this
      // came from.
      if(/^https?:\/\//i.test(String(j.source||""))){
        const s = document.getElementById("src");
        s.textContent = "from " + String(j.source).replace(/^https?:\/\//i, "").split("/")[0];
        s.title = j.source;
      }
      if(j.updated) document.getElementById("meta").textContent =
        "Saved " + new Date(Number(j.updated)).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});

      // Plain text in, paragraphs out. Built with createElement/textContent rather than
      // innerHTML so the stored text can never be interpreted as markup.
      bodyEl.innerHTML = "";
      const paras = String(j.body || "").split(/\n\s*\n/).map(t=>t.trim()).filter(Boolean);
      if(!paras.length){ say('<b>This reading is empty.</b>'); return; }
      paras.forEach(t=>{
        const p = document.createElement("p");
        // A single newline inside a paragraph stays a line break.
        t.split("\n").forEach((line, i) => {
          if(i) p.appendChild(document.createElement("br"));
          p.appendChild(document.createTextNode(line));
        });
        bodyEl.appendChild(p);
      });
    })
    .catch(() => say('<b>Couldn\'t load that reading.</b><br>Check the connection and try again.'));
})();
</script>
</body>
</html>
