<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch · The Learn Zone</title>
<!--
  A single video, on its own.

  The point of this page is what ISN'T on it. Sending a child to youtube.com for one
  history clip puts a sidebar of suggestions, a comment section and a channel page one
  click away. Here there is the video, its title, and the way back to their day.

  Honest limitation: the embed still shows YouTube's own end-screen when a video finishes
  (and any end-cards its creator added). `rel=0` used to suppress related videos entirely;
  since 2018 it only restricts them to the same channel. There is no embed parameter that
  removes the end-screen, so this reduces the pull rather than eliminating it.

  youtube-nocookie.com is used so YouTube doesn't set tracking cookies unless the video is
  actually played.
-->
<style>
  :root{ --ink:#1e2338; --muted:#7b8194; --line:#e6e8f0; --ry:#4f46e5; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:#11131c; color:#fff;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:14px; padding:12px 18px; flex:none; }
  .back{ color:#c9ccd8; text-decoration:none; font-weight:700; font-size:13.5px;
    border:1px solid #2e3346; border-radius:999px; padding:7px 14px; white-space:nowrap; }
  .back:hover{ background:#1b1f2e; color:#fff; }
  h1{ font-size:16px; margin:0; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:0 18px 18px; min-height:0; }
  .frame{ width:100%; max-width:1100px; aspect-ratio:16/9; background:#000; border-radius:14px;
    overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .frame iframe{ width:100%; height:100%; border:0; display:block; }
  .bad{ max-width:520px; margin:auto; background:#1b1f2e; border:1px solid #2e3346;
    border-radius:14px; padding:22px 24px; color:#c9ccd8; }
  .bad b{ color:#fff; }
  .bad a{ color:#9aa6ff; }
  footer{ flex:none; padding:0 18px 16px; color:#6b7085; font-size:12px; text-align:center; }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="../ry.html">← Back to my day</a>
  <h1 id="title">Video</h1>
</header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  // Only ever an 11-character YouTube id. Anything else is refused rather than dropped
  // into an iframe src, so a doctored link can't point this page somewhere else.
  const raw = (qs.get("v") || "").trim();
  const id = /^[\w-]{11}$/.test(raw) ? raw : "";
  const title = (qs.get("t") || "").trim();
  const kid = (qs.get("kid") || "").trim();

  if(kid === "reid" || kid === "ryland"){
    const back = document.getElementById("back");
    back.href = "../" + (kid === "reid" ? "reid.html" : "ry.html");
  }
  document.getElementById("title").textContent = title || "Video";
  document.title = (title || "Watch") + " · The Learn Zone";

  const main = document.getElementById("main");
  if(!id){
    main.innerHTML = '<div class="bad"><b>No video here.</b><br>' +
      'This page needs a YouTube link that carries a video id. Ask a grown-up to add the ' +
      'material again from the Teacher Dashboard.</div>';
    return;
  }
  const src = "https://www.youtube-nocookie.com/embed/" + id +
    "?rel=0&modestbranding=1&playsinline=1&iv_load_policy=3";
  const wrap = document.createElement("div");
  wrap.className = "frame";
  const f = document.createElement("iframe");
  f.src = src;
  f.title = title || "Video";
  // NOT "no-referrer": YouTube verifies the embedding domain and refuses to play at all
  // without one ("Video player configuration error", error 153). strict-origin sends only
  // the site, never the lesson page's full address.
  f.referrerPolicy = "strict-origin-when-cross-origin";
  f.allow = "accelerometer; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  wrap.appendChild(f);
  main.appendChild(wrap);
  document.getElementById("foot").textContent = "When it's finished, head back to your day.";
})();
</script>
</body>
</html>
