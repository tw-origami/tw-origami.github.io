<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Ryland's Zone · The Learn Zone</title>
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --ry:#4f46e5; --ry-soft:#eef2ff; --green:#166534; --amber:#b45309;
    --shadow:0 10px 30px rgba(30,41,99,.12); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#eef2ff,#f8fafc); display:flex; flex-direction:column; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; flex-wrap:wrap; }
  h1{ font-size:24px; margin:0; color:var(--ry); }
  .back{ text-decoration:none; color:var(--ry); font-weight:800; font-size:13.5px; background:#fff; padding:8px 14px; border-radius:999px; box-shadow:var(--shadow); }
  .tabs{ display:flex; gap:8px; padding:0 18px 12px; }
  .tab{ border:2px solid var(--ry-soft); background:#fff; border-radius:999px; padding:9px 20px; font-weight:800; cursor:pointer; font-size:14.5px; color:var(--muted); }
  .tab.active{ background:var(--ry); border-color:var(--ry); color:#fff; }
  .view-wrap{ flex:1; min-height:0; padding:0 12px 12px; }
  .hide{ display:none !important; }
  iframe{ width:100%; height:100%; border:none; border-radius:18px; box-shadow:var(--shadow); background:#fff; display:block; }

  .split{ display:flex; gap:12px; height:100%; }
  .split-left{ flex:1.3; min-width:0; }
  .split-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
  .donetoday{ background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; max-height:42%; overflow:auto; flex:none; }
  .donetoday h3{ margin:0 0 8px; font-size:15px; color:var(--green); }
  .dt-row{ display:flex; align-items:flex-start; gap:9px; padding:6px 2px; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .dt-row:last-child{ border-bottom:none; }
  .dt-ic{ flex:none; width:20px; height:20px; border-radius:6px; background:var(--green); color:#fff; font-size:12px;
    font-weight:800; display:flex; align-items:center; justify-content:center; }
  .dt-row.dt-note .dt-ic{ background:var(--amber); }
  .dt-subj{ display:block; font-weight:800; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
  .dt-txt{ display:block; font-weight:600; }
  .dt-row.dt-note .dt-txt{ font-style:italic; }
  .donetoday .empty{ color:var(--muted); font-size:13px; padding:6px 2px; }
  .calmini{ flex:1; min-height:0; }

  @media (max-width:760px){
    .split{ flex-direction:column; height:auto; }
    .split-left{ height:60vh; }
    .split-right{ height:60vh; }
    .donetoday{ max-height:160px; }
  }
</style>
</head>
<body>
  <div class="top">
    <h1>🧑‍🎓 Ryland's Zone</h1>
    <a class="back" href="index.html">← The Learn Zone</a>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="work">🧭 Today's Adventure</div>
    <div class="tab" data-tab="cal">🗓️ My Calendar</div>
  </div>
  <div class="view-wrap">
    <div id="viewWork" class="split">
      <div class="split-left"><iframe id="fWork" src="plan/kidzone.html?kid=ryland"></iframe></div>
      <div class="split-right">
        <div class="donetoday">
          <h3>✅ Done today</h3>
          <div id="doneTodayList"></div>
        </div>
        <div class="calmini"><iframe id="fCalMini" src="plan/calendar.html?kid=ryland"></iframe></div>
      </div>
    </div>
    <div id="viewCal" class="hide" style="height:100%;">
      <iframe id="fCalFull" src="plan/calendar.html?kid=ryland"></iframe>
    </div>
  </div>

<script src="plan/curriculum.js"></script>
<script src="plan/lz-common.js"></script>
<script>
const KID = "ryland";
const CUR = window.CURRICULUM || {};
const CFG = window.LZ_CONFIG || {paused:[]};
const { dkey, doneDate, doneDatesForSubject, noteKey, getNote, todayISO, isDone, habitKey } = window.LZ;

document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const isWork = t.dataset.tab==="work";
    document.getElementById("viewWork").classList.toggle("hide", !isWork);
    document.getElementById("viewCal").classList.toggle("hide", isWork);
  });
});

// A flat "what happened today" list, pulled straight from the same localStorage records
// kidzone.html (in the left iframe) writes to — so checking something off there updates
// this panel without needing its own copy of the checklist UI.
function buildDoneToday(){
  const subs = (CUR[KID]||[]).filter(s=>!(CFG.paused||[]).includes(s.subject));
  const today = todayISO();
  const items = [];
  subs.forEach(sub=>{
    if(sub.kind==="ongoing"){
      if(doneDatesForSubject(KID, sub.subject).includes(today)){
        items.push({subject:sub.subject, icon:"✓", text:"Done today"});
      }
    } else {
      (sub.lessons||[]).forEach(l=>{
        if(doneDate(dkey(KID,sub,l))===today){
          items.push({subject:sub.subject, icon:"✓", text:l.t+(l.p?` (p.${l.p})`:"")});
        }
      });
    }
    const note = getNote(noteKey(KID, sub.subject, today));
    if(note) items.push({subject:sub.subject, icon:"✎", text:note, isNote:true});
  });
  (CFG.habits||[]).forEach(h=>{
    if(isDone(habitKey(KID, h, today))) items.push({subject:"Daily habit", icon:"✓", text:h});
  });
  return items;
}
function renderDoneToday(){
  const items = buildDoneToday();
  const el = document.getElementById("doneTodayList");
  el.innerHTML = items.length
    ? items.map(it=>`<div class="dt-row${it.isNote?' dt-note':''}"><span class="dt-ic">${it.icon}</span>
        <div><span class="dt-subj">${it.subject}</span><span class="dt-txt">${it.text}</span></div></div>`).join("")
    : `<div class="empty">Nothing checked off yet today.</div>`;
}

renderDoneToday();
// Same-origin localStorage writes made inside the iframe fire a 'storage' event on this
// parent document — that's the main way we notice a new check-off. A light poll is kept
// as a fallback since 'storage' event timing/support can vary by browser.
window.addEventListener("storage", renderDoneToday);
setInterval(renderDoneToday, 4000);
</script>
</body>
</html>
