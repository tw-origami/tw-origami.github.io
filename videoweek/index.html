<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Video of the Week</title>
<style>
  :root{ --ink:#1f2430; --muted:#6b7280; --accent:#e11d48; --accent-soft:#ffe4e6; --shadow:0 10px 30px rgba(136,19,55,.14); }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#fff1f2,#f8fafc); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
  .nav{ position:fixed; top:16px; display:flex; gap:8px; background:#fff; padding:5px; border-radius:12px; box-shadow:var(--shadow); }
  .nav a{ text-decoration:none; font-weight:800; font-size:14px; color:var(--muted); padding:8px 14px; border-radius:9px; }
  .nav a:hover{ background:var(--accent-soft); color:var(--accent); }
  .card{ background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:44px 34px; text-align:center; max-width:460px; }
  .cones{ font-size:56px; letter-spacing:6px; }
  h1{ font-size:26px; margin:14px 0 8px; letter-spacing:-.5px; }
  p{ color:var(--muted); font-size:15.5px; line-height:1.6; margin:0 0 22px; }
  .tape{ display:inline-block; background:repeating-linear-gradient(45deg,#fbbf24,#fbbf24 14px,#1f2430 14px,#1f2430 28px);
    color:#fff; font-weight:900; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; padding:9px 20px; border-radius:8px;
    text-shadow:0 1px 3px rgba(0,0,0,.7); margin-bottom:22px; }
  .home{ display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:800; font-size:15px; padding:12px 22px; border-radius:13px; }
  .home:hover{ background:#be123c; }
</style>
</head>
<body>
  <div class="nav"><a href="../index.html">🏠 Home</a></div>
  <div class="card">
    <div class="cones">🚧📺🚧</div>
    <div><span class="tape">Under construction</span></div>
    <h1>Video of the Week</h1>
    <p>Our movie theater is getting built! 🍿<br>The crew is hammering away — check back soon for this week's hand-picked video.</p>
    <a class="home" href="../index.html">← Back to the Learn Zone</a>
  </div>
</body>
</html>
