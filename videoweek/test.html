<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Test</title>
<style>
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:#0f172a; color:#fff; padding:16px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .v{ color:#fbbf24; font-weight:800; font-size:13px; margin-bottom:14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .cell{ background:#1e293b; border-radius:12px; padding:10px; }
  .cell .lbl{ font-size:12.5px; font-weight:800; color:#94a3b8; margin-bottom:8px; }
  .cell .frame{ position:relative; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .cell .frame > div, .cell iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .status{ margin-top:8px; font-weight:900; font-size:15px; padding:7px 10px; border-radius:8px; background:#334155; text-align:center; }
  .status.ok{ background:#14532d; color:#4ade80; }
  .status.bad{ background:#7f1d1d; color:#fca5a5; }
</style>
</head>
<body>
  <h1>🔬 Player test — which boxes turn green?</h1>
  <div class="v">TEST PAGE v1 — all videos are muted and try to auto-play. Wait ~10 seconds, then look at the four labels.</div>
  <div class="grid" id="grid"></div>
<script>
  var CELLS = [
    { key:'A', label:'A — Your video · standard host',  video:'AehgK6e_a5Y', host:'https://www.youtube.com' },
    { key:'B', label:'B — Your video · nocookie host',  video:'AehgK6e_a5Y', host:'https://www.youtube-nocookie.com' },
    { key:'C', label:'C — TED-Ed control · standard',   video:'6LGCk08zMbg', host:'https://www.youtube.com' },
    { key:'D', label:'D — TED-Ed control · nocookie',   video:'6LGCk08zMbg', host:'https://www.youtube-nocookie.com' }
  ];
  var grid = document.getElementById('grid');
  CELLS.forEach(function(c){
    var d = document.createElement('div'); d.className='cell';
    d.innerHTML = '<div class="lbl">'+c.label+'</div><div class="frame"><div id="p_'+c.key+'"></div></div>'+
                  '<div class="status" id="s_'+c.key+'">loading…</div>';
    grid.appendChild(d);
  });
  function set(k, txt, cls){ var s=document.getElementById('s_'+k); s.textContent=txt; s.className='status '+(cls||''); }
  window.onYouTubeIframeAPIReady = function(){
    CELLS.forEach(function(c){
      new YT.Player('p_'+c.key, {
        host: c.host, videoId: c.video,
        playerVars: { playsinline:1, controls:0, mute:1, rel:0 },
        events: {
          onReady: function(e){ set(c.key,'ready — starting…'); e.target.mute(); e.target.playVideo(); },
          onStateChange: function(e){ if (e.data===1) set(c.key,'✅ PLAYING','ok'); },
          onError: function(e){ set(c.key,'❌ ERROR '+e.data,'bad'); }
        }
      });
    });
  };
  var s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
