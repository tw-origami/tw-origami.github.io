<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Teacher Dashboard · The Learn Zone</title>
<style>
  :root{ --ink:#15213b; --muted:#6b7a99; --line:#e4e9f2; --accent:#4f46e5; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:#f2f4f9; display:flex; flex-direction:column; }
  .top{ display:flex; align-items:center; gap:12px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1{ font-size:16px; margin:0 14px 0 0; }
  .tabs{ display:flex; gap:6px; }
  .tab{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 14px; font-weight:700; cursor:pointer; font-size:13px; color:var(--muted); }
  .tab:hover{ background:#f8fafc; }
  .tab.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .spacer{ flex:1; }
  .back{ text-decoration:none; color:var(--muted); font-weight:700; font-size:12.5px; border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:9px; }
  .back:hover{ color:var(--ink); }
  .frame-wrap{ flex:1; padding:0; }
  iframe{ width:100%; height:100%; border:none; background:#fff; display:block; }
  .hide{ display:none; }
</style>
</head>
<body>
  <div class="top">
    <h1>Teacher Dashboard</h1>
    <div class="tabs">
      <div class="tab active" data-frame="fPlan">📆 Week Planner</div>
      <div class="tab" data-frame="fCal">🗓️ Calendar</div>
      <div class="tab" data-frame="fPrint">🖨️ Daily Sheets</div>
      <div class="tab" data-frame="fMaster">📋 Old Tracker</div>
    </div>
    <div class="spacer"></div>
    <a class="back" href="index.html">← The Learn Zone</a>
  </div>
  <div class="frame-wrap">
    <iframe id="fPlan" src="plan/planner.html"></iframe>
    <iframe id="fCal" class="hide" data-src="plan/calendar.html"></iframe>
    <iframe id="fPrint" class="hide" data-src="plan/print.html"></iframe>
    <iframe id="fMaster" class="hide" data-src="plan/master.html"></iframe>
  </div>

<script>
// Tabs load once, on first visit, and are only hidden after that — switching back never
// reloads a frame, so nothing you were in the middle of gets thrown away.
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const target = t.dataset.frame;
    document.querySelectorAll(".frame-wrap iframe").forEach(f=>{
      const on = f.id===target;
      f.classList.toggle("hide", !on);
      if(on && !f.src && f.dataset.src) f.src = f.dataset.src;
    });
  });
});
</script>
</body>
</html>
